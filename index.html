<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Chess</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; overflow-x: hidden;
  font-family: 'Courier New', monospace;
  background: #1c1c1c; color: #fff; text-align: center;
}
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.content { position: relative; z-index: 2; padding: 40px 16px; }
h1 { font-size: 2.6rem; margin: 10px 0 4px; letter-spacing: 4px; }
.sub { color: #bbb; margin: 0 0 36px; }
.menu { display: flex; flex-direction: column; gap: 18px; max-width: 440px; margin: 0 auto; }
.card {
  background: #fff; color: #000; border: 4px solid #000;
  box-shadow: 6px 6px 0 #777; padding: 20px; font-size: 1.3rem; font-weight: bold;
  cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.card small { display: block; margin-top: 6px; font-size: .85rem; font-weight: normal; color: #444; }
.card:hover { transform: translate(-3px,-3px); box-shadow: 10px 10px 0 #777; }
.card:active { animation: pop .35s; }
.locked { background: #2a2a2a; color: #999; border-color: #555; box-shadow: 6px 6px 0 #111; cursor: not-allowed; }
.locked small { color: #777; }
.locked:hover { transform: none; box-shadow: 6px 6px 0 #111; }
.locked:active { animation: shake .35s; }
@keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(.93)} 70%{transform:scale(1.05)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

.cat { position: absolute; opacity: 0; animation: catFade 8s ease-in-out forwards; }
.cat svg { display: block; width: 100%; height: auto; }
@keyframes catFade {
  0% { opacity: 0; transform: translateY(14px); }
  20%, 70% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-14px); }
}
.eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)} }

.piece { position: absolute; bottom: -90px; color: #fff; opacity: .15; animation: rise linear forwards; }
@keyframes rise {
  from { transform: translateY(0) rotate(0deg); }
  to { transform: translateY(-120vh) rotate(180deg); }
}
</style>
</head>
<body>

<div id="bg"></div>

<div class="content">
  <h1>🐱 CAT CHESS ♟</h1>
  <p class="sub">Chess, but with cats</p>
  <div class="menu">
    <div class="card" onclick="alert('Puzzles are coming soon!')">
      🧩 Puzzle Challenge
      <small>Easy, hard, or random puzzles</small>
    </div>
    <div class="card" onclick="alert('Choose-your-cat mode is coming soon!')">
      😺 Play vs a Cat
      <small>Pick one of 15 characters</small>
    </div>
    <div class="card locked">
      🔒 Pixel Adventure
      <small>Under maintenance</small>
    </div>
  </div>
</div>

<script>
const bg = document.getElementById('bg');

const cats = [
  `<svg viewBox="0 0 100 130"><g fill="#000" stroke="#fff" stroke-width="2">
    <polygon points="25,45 32,5 48,40"/><polygon points="52,40 68,5 75,45"/>
    <ellipse cx="50" cy="58" rx="28" ry="24"/><path d="M28,70 Q50,140 72,70 Z"/></g>
    <ellipse class="eye" cx="40" cy="55" rx="7" ry="8" fill="#fff"/>
    <ellipse class="eye" cx="60" cy="55" rx="7" ry="8" fill="#fff"/>
    <circle cx="42" cy="56" r="3" fill="#000"/><circle cx="62" cy="56" r="3" fill="#000"/></svg>`,
  `<svg viewBox="0 0 100 130"><g fill="#000" stroke="#fff" stroke-width="2">
    <polygon points="22,48 30,2 46,42"/><polygon points="54,42 70,2 78,48"/>
    <ellipse cx="50" cy="60" rx="30" ry="26"/><path d="M26,76 Q50,140 74,76 Z"/></g>
    <circle class="eye" cx="38" cy="58" r="11" fill="#fff"/>
    <circle class="eye" cx="64" cy="58" r="11" fill="#fff"/>
    <circle cx="41" cy="60" r="4" fill="#000"/><circle cx="67" cy="60" r="4" fill="#000"/></svg>`
];

function spawnCat() {
  const d = document.createElement('div');
  d.className = 'cat';
  d.innerHTML = cats[Math.floor(Math.random() * cats.length)];
  const w = 80 + Math.random() * 70;
  d.style.width = w + 'px';
  d.style.left = Math.random() * (innerWidth - w) + 'px';
  d.style.top = Math.random() * (innerHeight - w * 1.3) + 'px';
  d.style.animationDuration = (6 + Math.random() * 3) + 's';
  bg.appendChild(d);
  setTimeout(() => d.remove(), 9500);
}

const pieces = ['♟','♞','♜','♛','♚','♝'];

function spawnPiece() {
  const p = document.createElement('div');
  p.className = 'piece';
  p.textContent = pieces[Math.floor(Math.random() * pieces.length)] + '\uFE0E';
  p.style.left = Math.random() * 95 + '%';
  p.style.fontSize = (30 + Math.random() * 40) + 'px';
  const dur = 18 + Math.random() * 14;
  p.style.animationDuration = dur + 's';
  bg.appendChild(p);
  setTimeout(() => p.remove(), dur * 1000);
}

for (let i = 0; i < 5; i++) spawnCat();
for (let i = 0; i < 6; i++) spawnPiece();
setInterval(spawnCat, 1500);
setInterval(spawnPiece, 3000);
</script>

</body>
</html>
