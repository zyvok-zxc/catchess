<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Chess</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Courier New',monospace;color:#fff;text-align:center;background:#000}
#bg{position:fixed;inset:0;z-index:0;background:#000 url('IMG_1692.jpeg') left center/cover no-repeat;image-rendering:pixelated}
#bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
#pieces{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.piece{position:absolute;bottom:-90px;color:#fff;opacity:.18;animation:rise linear forwards}
@keyframes rise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120vh) rotate(180deg)}}
.content{position:relative;z-index:2;padding:30px 16px}
.brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.brand img{width:90px;height:auto;background:#fff;border:4px solid #000;border-radius:14px;image-rendering:pixelated;animation:float 3s ease-in-out infinite}
.brand h1{font-size:2.2rem;margin:0;letter-spacing:3px;text-shadow:4px 4px 0 #ff1493}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sub{color:#ddd;margin:0 0 32px}
.menu{display:flex;flex-direction:column;gap:18px;max-width:440px;margin:0 auto}
.card{background:rgba(0,0,0,.75);border:4px solid #fff;box-shadow:6px 6px 0 #ff1493;padding:20px;font-size:1.3rem;font-weight:bold;cursor:pointer;transition:transform .12s,box-shadow .12s}
.card small{display:block;margin-top:6px;font-size:.85rem;font-weight:normal;color:#ccc}
.card:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 #ff1493}
.card:active{animation:pop .3s}
.locked{border-color:#666;box-shadow:6px 6px 0 #333;color:#999;cursor:not-allowed}
.locked:hover{transform:none;box-shadow:6px 6px 0 #333}
.locked:active{animation:shake .3s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#start{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;cursor:pointer}
#start img{width:150px;background:#fff;border:5px solid #000;border-radius:18px;animation:float 3s ease-in-out infinite}
#start p{font-size:1.4rem;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>

<div id="bg"></div>
<div id="pieces"></div>

<div id="start" onclick="startSite()">
  <img src="IMG_1690.jpeg" alt="Cat Chess logo">
  <p>TAP TO START</p>
</div>

<div class="content">
  <div class="brand">
    <img src="IMG_1690.jpeg" alt="logo">
    <h1>CAT CHESS</h1>
  </div>
  <p class="sub">Chess, but with cats</p>
  <div class="menu">
    <div class="card" onclick="beep(660,.1);alert('Puzzles are coming soon!')">
      🧩 Puzzle Challenge<small>Easy, hard, or random puzzles</small>
    </div>
    <div class="card" onclick="beep(740,.1);alert('Choose-your-cat mode is coming soon!')">
      😺 Play vs a Cat<small>Pick one of 15 characters</small>
    </div>
    <div class="card locked" onclick="beep(150,.25)">
      🔒 Pixel Adventure<small>Under maintenance</small>
    </div>
  </div>
</div>

<script>
let ctx;
function beep(f,d){
  if(!ctx)return;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=f;g.gain.value=.08;
  o.connect(g);g.connect(ctx.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);
  o.stop(ctx.currentTime+d);
}
const music=new Audio('glass_horizons.mp3');
music.loop=true;music.volume=.5;
function startSite(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  beep(523,.1);
  setTimeout(()=>beep(659,.1),110);
  setTimeout(()=>beep(784,.2),220);
  music.play().catch(()=>{});
  document.getElementById('start').style.display='none';
}
const pieces=['♟','♞','♜','♛','♚','♝'];
function spawnPiece(){
  const p=document.createElement('div');
  p.className='piece';
  p.textContent=pieces[Math.floor(Math.random()*6)]+'\uFE0E';
  p.style.left=Math.random()*95+'%';
  p.style.fontSize=(30+Math.random()*40)+'px';
  const dur=18+Math.random()*14;
  p.style.animationDuration=dur+'s';
  document.getElementById('pieces').appendChild(p);
  setTimeout(()=>p.remove(),dur*1000);
}
for(let i=0;i<5;i++)spawnPiece();
setInterval(spawnPiece,3000);
</script>

</body>
</html>
