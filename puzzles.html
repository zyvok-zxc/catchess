<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Chess - Puzzles</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Courier New',monospace;color:#fff;text-align:center;background:#000 url(IMG_1727.jpeg) center/cover fixed}
body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.6)}
.w{position:relative;max-width:520px;margin:auto;padding:14px 10px}
.bar{display:flex;justify-content:space-between;align-items:center}
button,.card{font-family:inherit;color:#fff;background:rgba(0,0,0,.85);border:3px solid #fff;cursor:pointer}
button{padding:8px 14px;font-size:1rem;margin:4px}
h1{text-shadow:3px 3px 0 #ff1493;letter-spacing:2px}
.card{display:block;width:100%;padding:16px;margin:12px 0;font-size:1.15rem;box-shadow:4px 4px 0 #ff1493;text-align:start}
.card small{display:block;color:#ccc;margin-top:4px}
.card img{width:60px;height:60px;object-fit:contain;background:#fff;border-radius:8px;vertical-align:middle;margin-inline-end:10px}
.lock{opacity:.5;cursor:not-allowed;border-color:#777;box-shadow:none}
#game{display:none}
#hud{font-size:1.1rem;margin:8px 0}
#hud img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:6px;vertical-align:middle}
#msg{min-height:26px;margin:6px 0;background:rgba(0,0,0,.7);padding:6px;border:2px solid #ff1493}
#bd{direction:ltr;position:relative;width:min(96vw,480px);aspect-ratio:1;margin:8px auto;border:4px solid #fff;user-select:none}
.sq{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;font-size:min(10vw,52px);line-height:1}
.sq.l{box-shadow:inset 0 0 0 100px rgba(255,235,59,.45)}
.sq.s{box-shadow:inset 0 0 0 100px rgba(255,235,59,.7)}
.sq.d::after{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(0,0,0,.4)}
.pw{color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.pb{color:#000;text-shadow:0 0 2px #fff,0 0 2px #fff}
</style>
</head>
<body>
<div class="w">
  <div class="bar"><a id="bk" href="index.html" style="color:#fff"></a><span><button id="bl"></button><button id="bs"></button></span></div>
  <h1 id="h"></h1>
  <div id="menu"></div>
  <div id="pickc" style="display:none"></div>
  <div id="game">
    <div id="hud"></div>
    <div id="msg"></div>
    <div id="bd"></div>
    <button id="hb"></button><button id="sk"></button><button id="mb"></button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const R=a=>a[Math.floor(Math.random()*a.length)];
const S=JSON.parse(localStorage.getItem('cc')||'{}');
const st={lang:S.lang||'en',music:S.music!==false,sfx:S.sfx!==false};
const save=()=>localStorage.setItem('cc',JSON.stringify(Object.assign(JSON.parse(localStorage.getItem('cc')||'{}'),st)));
const T={
en:{title:'PUZZLES',back:'← Back',m1:'Puzzle Ladder',d1:'Every puzzle you solve makes the next one harder',m2:'Speed Challenge',d2:'Solve as many puzzles as you can in 90 seconds',m3:'Character Race',d3:'Race the top 5 characters in a 90-second puzzle duel',m4:'Forbidden Files',d4:'Secret case files... coming soon',pick:'Pick your rival',hint:'Hint',skip:'Skip',menu:'Menu',lvl:'Level',time:'Time',you:'You',mate:'Mate in',play:'You play',w:'White',b:'Black',wrong:'Wrong move!',ok:'Correct!',go:'Game over',won:'You won the race!',lost:'The rival won.',tie:'A tie!',reach:'You reached level',solved:'You solved',lang:'Language',sfx:'Sounds',on:'ON',off:'OFF'},
ar:{title:'الألغاز',back:'رجوع →',m1:'سلّم الألغاز',d1:'كل لغز تحله يصير اللي بعده أصعب',m2:'تحدي السرعة',d2:'حل أكبر عدد من الألغاز خلال 90 ثانية',m3:'سباق الشخصيات',d3:'سباق ألغاز 90 ثانية ضد أقوى 5 شخصيات',m4:'الملفات المحظورة',d4:'ملفات قضايا سرية... قريباً',pick:'اختر خصمك',hint:'تلميح',skip:'تخطّي',menu:'القائمة',lvl:'المستوى',time:'الوقت',you:'أنت',mate:'كش مات في',play:'تلعب',w:'الأبيض',b:'الأسود',wrong:'نقلة خاطئة!',ok:'صح!',go:'انتهت اللعبة',won:'فزت بالسباق!',lost:'فاز الخصم.',tie:'تعادل!',reach:'وصلت للمستوى',solved:'حللت',lang:'اللغة',sfx:'الأصوات',on:'تشغيل',off:'إيقاف'}};
const t=k=>T[st.lang][k];
const CH=[{n:'Catot',i:'IMG_1770.jpeg',avg:20},{n:'Clown Cat',i:'IMG_1769.jpeg',avg:16},{n:'The Obsessed Cat',i:'IMG_1705.png',avg:11},{n:'Professor Kleem',i:'IMG_1751.jpeg',avg:8},{n:'Dracula',i:'IMG_1775.jpeg',avg:6}];

let ac;
function snd(k){if(!st.sfx)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();
 const q={mv:[[330,.05]],cap:[[200,.08],[140,.1]],chk:[[880,.08],[1100,.12]],end:[[523,.12],[659,.12],[784,.12],[1047,.25]]}[k];
 let t0=ac.currentTime;
 q.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.08,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d);t0+=d})}
const mu=new Audio('glass_horizons.mp3');mu.loop=true;mu.volume=.3;
mu.addEventListener('loadedmetadata',()=>{mu.currentTime=+localStorage.getItem('cc_t')||0});
setInterval(()=>{if(!mu.paused)localStorage.setItem('cc_t',mu.currentTime)},1000);
document.addEventListener('pointerdown',()=>{if(st.music)mu.play().catch(()=>{})},{once:true});

/* puzzle generator: forcing mates (mate in 1, 2 or 3), found by code */
function mate(g,n){
 const ms=g.moves({verbose:true});
 for(const m of ms){
  g.move(m);let ok=false;
  if(g.in_checkmate())ok=true;
  else if(n>1&&g.in_check()&&!g.game_over()){
   const rs=g.moves();
   ok=rs.length>0&&rs.every(r=>{g.move(r);const x=mate(g,n-1);g.undo();return x})}
  g.undo();
  if(ok)return m}
 return null}
function find(n){
 for(let tr=0;tr<2;tr++){
  const g=new Chess(),k=14+Math.floor(Math.random()*40);
  for(let i=0;i<k&&!g.game_over();i++){
   g.move(R(g.moves()));
   if(i<10||g.game_over())continue;
   if(n==1){
    const ms=g.moves({verbose:true});let c=0;
    for(const m of ms){g.move(m);if(g.in_checkmate())c++;g.undo()}
    if(c==1&&ms.length>=8)return{fen:g.fen(),n}}
   else if(!g.in_check()&&mate(g,n)&&!mate(g,n-1))return{fen:g.fen(),n}}}
 return null}
const pool={1:[],2:[],3:[]};
function fill(){
 let busyF=false;
 for(const n of [1,2,3])if(pool[n].length<4){const p=find(n);if(p)pool[n].push(p);busyF=true;break}
 setTimeout(fill,busyF?80:600)}
fill();

/* game */
let G,pz,sel=null,last=[],flip=false,mode,ch,lives,score,level,tleft,tid,cid,csc,over=true,busy=false;
const GL={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
function build(){
 const hints=sel?G.moves({square:sel,verbose:true}).map(m=>m.to):[];
 let h='';
 for(let y=0;y<8;y++)for(let x=0;x<8;x++){
  const fx=flip?7-x:x,fy=flip?7-y:y,n='abcdefgh'[fx]+(8-fy),p=G.get(n);
  h+='<div class="sq'+(last.includes(n)?' l':'')+(sel==n?' s':'')+(hints.includes(n)?' d':'')+'" data-s="'+n+'" style="left:'+x*12.5+'%;top:'+y*12.5+'%;background:'+((x+y)%2?'#4c1d95':'#c4b5fd')+'">'+(p?'<span class="p'+p.color+'">'+GL[p.type]+'\uFE0E</span>':'')+'</div>'}
 $('bd').innerHTML=h}
$('bd').onclick=e=>{const s=e.target.closest('.sq');if(s)click(s.dataset.s)};
function click(sq){
 if(over||busy)return;
 if(sel&&sel!=sq&&G.moves({square:sel,verbose:true}).some(m=>m.to==sq)){attempt(sel,sq);return}
 const p=G.get(sq);
 sel=p&&p.color==pz.att?sq:null;build()}
function msg(x){$('msg').textContent=x}
function hud(){
 let s='';
 if(mode=='ladder')s=t('lvl')+' '+level+' · ♥'.repeat(1)+lives+' · ✔'+score;
 else{s='⏱ '+tleft+'s · '+t('you')+' '+score;
  if(ch)s+=' — <img src="'+ch.i+'"> '+ch.n+' '+csc}
 $('hud').innerHTML=s}
function lvN(){return mode=='ladder'?(level<=3?1:level<=6?2:3):R([1,1,2,2,3])}
function nextP(){
 if(over)return;
 const n=lvN();
 if(pool[n].length)load(pool[n].shift());
 else{msg('...');setTimeout(()=>{const p=find(n);p?load(p):nextP()},30)}}
function load(p){
 G=new Chess(p.fen);pz={n:p.n,rem:p.n,att:G.turn()};
 flip=pz.att=='b';sel=null;last=[];busy=false;
 msg(t('mate')+' '+p.n+' · '+t('play')+' '+t(pz.att=='w'?'w':'b'));
 build();hud()}
function attempt(f,to){
 const m=G.move({from:f,to:to,promotion:'q'});sel=null;
 let ok=G.in_checkmate();
 if(!ok&&pz.rem>1&&G.in_check()&&!G.game_over()){
  const rs=G.moves();
  ok=rs.length>0&&rs.every(r=>{G.move(r);const x=mate(G,pz.rem-1);G.undo();return x})}
 if(!ok){
  G.undo();last=[];build();snd('cap');msg(t('wrong'));
  if(mode=='ladder'){lives--;hud();if(lives<=0)finish()}
  else{busy=true;setTimeout(nextP,500)}
  return}
 last=[m.from,m.to];build();
 if(G.in_checkmate()){
  snd('end');msg(t('ok'));score++;if(mode=='ladder')level++;
  hud();busy=true;setTimeout(nextP,800);return}
 snd('chk');busy=true;
 setTimeout(()=>{
  const r=G.move(R(G.moves()));
  pz.rem--;last=[r.from,r.to];build();busy=false},450)}
function cTick(){
 if(over)return;
 csc++;hud();
 cid=setTimeout(cTick,ch.avg*1000*(.6+Math.random()*.8))}
function start(m,c){
 mode=m;ch=c||null;score=0;level=1;lives=3;tleft=90;csc=0;over=false;
 clearInterval(tid);clearTimeout(cid);
 $('menu').style.display='none';$('pickc').style.display='none';$('h').style.display='none';$('game').style.display='block';
 if(m!='ladder')tid=setInterval(()=>{tleft--;hud();if(tleft<=0)finish()},1000);
 if(ch)cid=setTimeout(cTick,ch.avg*1000*(.6+Math.random()*.8));
 nextP()}
function finish(){
 over=true;clearInterval(tid);clearTimeout(cid);snd('end');
 let s=t('go')+' — ';
 if(mode=='ladder')s+=t('reach')+' '+level;
 else if(ch)s+=score>csc?t('won'):score<csc?t('lost'):t('tie');
 else s+=t('solved')+' '+score;
 msg(s);
 const b=JSON.parse(localStorage.getItem('cc_pz')||'{}');
 if(mode=='ladder')b.ladder=Math.max(b.ladder||0,level);else if(!ch)b.speed=Math.max(b.speed||0,score);
 localStorage.setItem('cc_pz',JSON.stringify(b))}
function toMenu(){
 over=true;clearInterval(tid);clearTimeout(cid);
 $('game').style.display='none';$('menu').style.display='block';$('h').style.display='block';$('pickc').style.display='none'}
$('hb').onclick=()=>{if(over||busy)return;const m=mate(G,pz.rem);if(m){sel=m.from;build()}};
$('sk').onclick=()=>{if(over||busy)return;if(mode=='ladder'){lives--;hud();if(lives<=0){finish();return}}nextP()};
$('mb').onclick=toMenu;

function ui(){
 document.documentElement.dir=st.lang=='ar'?'rtl':'ltr';
 $('h').textContent=t('title');$('bk').textContent=t('back');
 $('bl').textContent=st.lang=='en'?'العربية':'English';
 $('bs').textContent='🔊 '+t(st.sfx?'on':'off');
 $('hb').textContent=t('hint');$('sk').textContent=t('skip');$('mb').textContent=t('menu');
 $('menu').innerHTML=
  '<div class="card" onclick="start(\'ladder\')">🪜 '+t('m1')+'<small>'+t('d1')+'</small></div>'+
  '<div class="card" onclick="start(\'speed\')">⏱ '+t('m2')+'<small>'+t('d2')+'</small></div>'+
  '<div class="card" onclick="showPick()">😼 '+t('m3')+'<small>'+t('d3')+'</small></div>'+
  '<div class="card lock">🔒 '+t('m4')+'<small>'+t('d4')+'</small></div>';
 $('pickc').innerHTML='<h3>'+t('pick')+'</h3>'+CH.map((c,i)=>'<div class="card" onclick="start(\'race\',CH['+i+'])"><img src="'+c.i+'">'+c.n+'</div>').join('')}
function showPick(){$('menu').style.display='none';$('pickc').style.display='block'}
$('bl').onclick=()=>{st.lang=st.lang=='en'?'ar':'en';save();ui()};
$('bs').onclick=()=>{st.sfx=!st.sfx;save();ui()};
ui();
</script>
</body>
</html>
