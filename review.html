<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Chess - Review</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Courier New',monospace;color:#fff;text-align:center;background:#05000f url(IMG_1692.jpeg) left center/cover fixed}
body::before{content:"";position:fixed;inset:0;background:rgba(5,0,15,.72)}
.w{position:relative;max-width:1000px;margin:auto;padding:14px 10px}
h1{font-size:2.3rem;margin:6px 0;text-shadow:0 0 12px #e879f9,0 0 26px #c026d3}
#sub{color:#e9d5ff;margin-bottom:10px}
.top{display:flex;justify-content:space-between}
button,.bt{font-family:inherit;color:#fff;background:rgba(10,0,25,.9);border:3px solid #fff;border-radius:12px;box-shadow:0 0 10px #c026d3;cursor:pointer;padding:8px 14px;font-size:1.1rem;margin:4px;text-decoration:none}
.p{background:rgba(10,0,25,.85);border:3px solid #fff;border-radius:16px;box-shadow:0 0 14px #c026d3,inset 0 0 8px #c026d3;padding:10px}
#hint{margin:8px auto;max-width:520px}
.g{display:grid;gap:12px;grid-template-columns:1fr;grid-template-areas:"coach" "board" "nav" "stats" "moves"}
@media(min-width:900px){.g{grid-template-columns:280px minmax(0,480px) 240px;justify-content:center;align-items:start;grid-template-areas:"coach board stats" "nav board stats" "moves board stats"}}
.coach{display:flex;gap:10px;align-items:center;text-align:start}
.coach img{width:90px;height:90px;object-fit:contain;background:#fff;border:3px solid #000;border-radius:12px;flex:none}
#say{flex:1;background:#f3e8ff;color:#000;border:3px solid #000;border-radius:14px;padding:8px;min-height:70px}
#bd{direction:ltr;position:relative;width:100%;aspect-ratio:1;border:4px solid #fff;box-shadow:0 0 16px #c026d3}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{box-shadow:inset 0 0 0 100px rgba(255,235,59,.5)}
.pc{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;font-size:min(11vw,58px);line-height:1}
.pw{color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.pb{color:#000;text-shadow:0 0 2px #fff,0 0 2px #fff}
#ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.bdg{position:absolute;width:7.5%;height:7.5%;z-index:5}
.gb{animation:gl .5s steps(2) infinite}
@keyframes gl{
0%{transform:translate(0);filter:none}
25%{transform:translate(-2px,1px);filter:drop-shadow(3px 0 #0ff) drop-shadow(-3px 0 #f0f)}
50%{transform:translate(2px,-1px);filter:drop-shadow(-3px 0 #0ff) drop-shadow(3px 0 #f0f)}
75%{transform:translate(-1px,-2px);filter:drop-shadow(3px 0 #f0f) drop-shadow(-3px 0 #0ff)}
100%{transform:translate(0);filter:none}}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
#mv{max-height:260px;overflow:auto;text-align:start}
.mr{display:flex;align-items:center;gap:6px;padding:3px 0}
.mv{cursor:pointer;padding:1px 6px;border-radius:6px}
.mv.on{background:#c026d3}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center}
#modal>div{background:#12001f;border:4px solid #fff;border-radius:16px;padding:20px;width:min(90vw,340px)}
</style>
</head>
<body>
<div class="w">
  <div class="top"><a class="bt" id="bk" href="cats.html"></a><button id="sb"></button></div>
  <h1 id="h"></h1>
  <div id="sub"></div>
  <div class="p" id="hint"></div>
  <div id="pg"></div>
  <div class="g" id="main" style="display:none">
    <div class="p coach" style="grid-area:coach"><img src="098D8C9B-5E24-4766-AD2F-8CF1E878A199.png" alt=""><div id="say"></div></div>
    <div style="grid-area:board"><div id="bd"></div><div id="evn"></div></div>
    <div class="p row" style="grid-area:nav">
      <button onclick="show(0)">⏮</button>
      <button onclick="show(cur-1)">◀</button>
      <button id="pl" onclick="auto()">▶</button>
      <button onclick="show(cur+1)">▷</button>
      <button onclick="show(hist.length)">⏭</button>
    </div>
    <div class="p" style="grid-area:stats" id="stats"></div>
    <div class="p" style="grid-area:moves"><h3 id="mh"></h3><div id="mv"></div></div>
  </div>
</div>
<div id="modal"><div>
  <h3 id="mt"></h3>
  <p><button id="bl"></button></p>
  <p><button id="bm"></button></p>
  <p><button id="bs"></button></p>
  <p><button id="bp"></button></p>
  <button id="bx"></button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const S=JSON.parse(localStorage.getItem('cc')||'{}');
const st={lang:S.lang||'en',music:S.music!==false,sfx:S.sfx!==false,px:!!S.px};
const save=()=>localStorage.setItem('cc',JSON.stringify(Object.assign(JSON.parse(localStorage.getItem('cc')||'{}'),st)));
const D=JSON.parse(localStorage.getItem('cc_game')||'null');
const T={
en:{back:'← Back',title:'GAME REVIEW',sub:'Review your play and learn from your mistakes',hint:'💡 Use the arrow keys or the buttons to move between moves',stats:'Review stats',acc:'Accuracy',best:'Best result',moves:'Move analysis',set:'⚙ Settings',lang:'Language',mus:'Music',sfx:'Sounds',px:'Pieces',pix:'Pixel',nor:'Normal',on:'ON',off:'OFF',close:'Close',ana:'Analyzing',none:'No saved game. Play a game first.',hi:'Hi! I am the Teacher. Press ▶ and we will review your game move by move.',err:'Could not load the engine.'},
ar:{back:'الرجوع →',title:'مراجعة المباراة',sub:'راجع لعبك وتعلم من أخطائك',hint:'💡 استخدم الأسهم أو الأزرار للتنقل بين النقلات',stats:'إحصائيات المراجعة',acc:'دقة النقلات',best:'أفضل نتيجة',moves:'تحليل النقلات',set:'⚙ الإعدادات',lang:'اللغة',mus:'الموسيقى',sfx:'الأصوات',px:'القطع',pix:'بكسل',nor:'عادية',on:'تشغيل',off:'إيقاف',close:'إغلاق',ana:'جاري التحليل',none:'ما في مباراة محفوظة. العب مباراة أول.',hi:'مرحباً! أنا المعلمة. اضغط ▶ ونراجع مباراتك نقلة نقلة.',err:'تعذر تحميل المحرك.'}};
const t=k=>T[st.lang][k];

/* music + sounds */
const mu=new Audio('eight_squares_left.mp3');mu.loop=true;mu.volume=.45;
document.addEventListener('pointerdown',()=>{if(st.music)mu.play().catch(()=>{})},{once:true});
let ac;
function blip(){
 if(!st.sfx)return;
 ac=ac||new(window.AudioContext||window.webkitAudioContext)();
 const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime;
 o.type='square';o.frequency.value=420+Math.random()*180;
 g.gain.setValueAtTime(.04,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.05);
 o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+.05)}
let tw=null;
function type(s){
 clearInterval(tw);const el=$('say');el.textContent='';
 let i=0,wait=0;
 tw=setInterval(()=>{
  if(wait>0){wait--;return}
  if(i>=s.length){clearInterval(tw);return}
  const c=s[i++];el.textContent=s.slice(0,i);
  if(c!=' ')blip();
  if('.!?؟،,'.includes(c))wait=6},35)}

/* cat-face icons */
const K=[
['gb','#ff00ff','Glitch Brilliant','جليتش بريليانت'],
['br','#22d3ee','Brilliant','بريليانت'],
['ex','#4ade80','Excellent','ممتازة'],
['gd','#ffffff','Good','جيدة'],
['in','#facc15','Inaccuracy','غير دقيقة'],
['mi','#fb923c','Mistake','خطأ'],
['bl','#ef4444','Blunder','بلاندر']];
const KM={};K.forEach(k=>KM[k[0]]=k);
const E={
gb:['★','M13 29Q20 38 27 29Z',1],br:['★','M13 29Q20 38 27 29Z',1],
ex:['^','M14 29Q20 35 26 29',0],gd:['•','M15 30Q20 33 25 30',0],
in:['•','M15 31H25',0],mi:['°','M14 33Q20 28 26 33',0],bl:['×','M15 31Q20 39 25 31Z',1]};
function face(k,s){
 const c=KM[k][1],e=E[k];
 return '<svg viewBox="0 0 40 40" class="'+(k=='gb'?'gb':'')+'" style="width:'+s+';height:'+s+'"><path d="M5 17L8 2L19 9ZM35 17L32 2L21 9Z" fill="'+c+'"/><circle cx="20" cy="22" r="15" fill="'+c+'"/><g fill="#000" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial"><text x="13" y="25">'+e[0]+'</text><text x="27" y="25">'+e[0]+'</text></g><path d="'+e[1]+'" stroke="#000" stroke-width="2" stroke-linecap="round" fill="'+(e[2]?'#000':'none')+'"/></svg>'}

/* pixel pieces */
const SP={
p:['........','...##...','..####..','...##...','..####..','...##...','.######.','.######.'],
r:['.#.##.#.','.######.','..####..','..####..','..####..','..####..','.######.','.######.'],
n:['..###...','.#####..','##.####.','#..####.','...####.','..#####.','.######.','.######.'],
b:['...##...','..####..','..#.##..','..####..','...##...','..####..','.######.','.######.'],
q:['#.#..#.#','########','.######.','..####..','..####..','..####..','.######.','.######.'],
k:['...##...','.######.','...##...','..####..','..####..','..####..','.######.','.######.']};
function pix(type,col){
 const m=col=='w'?'#fff':'#111',o=col=='w'?'#000':'#fff';let a='',b='';
 SP[type].forEach((r,y)=>[...r].forEach((c,x)=>{if(c=='#'){
  [[-1,0],[1,0],[0,-1],[0,1]].forEach(d=>a+='<rect x="'+(x+1+d[0])+'" y="'+(y+1+d[1])+'" width="1" height="1"/>');
  b+='<rect x="'+(x+1)+'" y="'+(y+1)+'" width="1" height="1"/>'}}));
 return '<svg viewBox="0 0 10 10" style="width:84%;height:84%" shape-rendering="crispEdges"><g fill="'+o+'">'+a+'</g><g fill="'+m+'">'+b+'</g></svg>'}

const M={
gb:['FIVE brilliant moves in a row?! Reality is glitching! {m}!','خمس نقلات بريليانت ورا بعض؟! الواقع يتشوش! {m}!'],
br:['Brilliant! {m} is a sacrifice the engine loves. Wow!','بريليانت! {m} تضحية يحبها المحرك. واو!'],
ex:['Excellent! {m} is one of the best moves here.','ممتازة! {m} من أفضل النقلات هنا.'],
gd:['Good move. {m} keeps things solid.','نقلة جيدة. {m} تبقي الوضع متماسكاً.'],
in:['{m} is a bit inaccurate. {b} was better.','{m} غير دقيقة قليلاً. كانت {b} أفضل.'],
mi:['{m} is a mistake, it cost about {l} pawns. Try {b} next time.','{m} خطأ، كلفتك حوالي {l} بيدق. جرّب {b} المرة الجاية.'],
bl:['Blunder! {m} threw away about {l} pawns. {b} was the move!','بلاندر! {m} ضيّعت حوالي {l} بيدق. كانت {b} هي النقلة!']};
const CC={'Cat 67':['#39ff14','#7a1fa2'],'BOBBY':['#e63946','#2f6bff'],'The Obsessed Cat':['#d4af37','#1a1a1a'],'The Musical Cat':['#cfe3f2','#6b7a8f'],'The Ghost Cat':['#ffffff','#9db4e0']};
const V={p:1,n:3,b:3,r:5,q:9,k:0};
const GL={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
let hist=[],fens=[],E2=[],B=[],cls=[],loss=[],cur=0,cnt={},ACC=0,BEST=0,timer=null;

function ui(){
 document.documentElement.dir=st.lang=='ar'?'rtl':'ltr';
 $('bk').textContent=t('back');$('h').textContent=t('title');$('sub').textContent=t('sub');$('hint').textContent=t('hint');
 $('sb').textContent=t('set');$('mt').textContent=t('set');$('bx').textContent=t('close');$('mh').textContent=t('moves');
 $('bl').textContent=t('lang')+': '+(st.lang=='en'?'English':'العربية');
 $('bm').textContent=t('mus')+': '+t(st.music?'on':'off');
 $('bs').textContent=t('sfx')+': '+t(st.sfx?'on':'off');
 $('bp').textContent=t('px')+': '+t(st.px?'pix':'nor')}
ui();

if(!D){$('pg').textContent=t('none')}
else{
 const g=new Chess();g.load_pgn(D.pgn);
 hist=g.history({verbose:true});
 const r=new Chess();fens=[r.fen()];
 hist.forEach(m=>{r.move(m.san);fens.push(r.fen())});

 function isSac(fen,san){
  const x=new Chess(fen),m=x.move(san);
  if(!m||V[m.piece]<3)return false;
  if(m.captured&&V[m.captured]>=V[m.piece])return false;
  return x.moves({verbose:true}).some(y=>y.to==m.to&&y.captured)}
 function bestSan(i){
  const u=B[i];if(!u)return '...';
  const x=new Chess(fens[i]),m=x.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});
  return m?m.san:'...'}

 function done(){
  let streak=0;K.forEach(k=>cnt[k[0]]=0);
  hist.forEach((m,j)=>{
   if(j%2)return;
   const l=Math.max(0,E2[j]-E2[j+1]);loss[j]=l;let k;
   if(l<=20&&E2[j+1]>=-150&&E2[j]<600&&isSac(fens[j],m.san))k='br';
   else k=l<=20?'ex':l<=60?'gd':l<=130?'in':l<=300?'mi':'bl';
   if(k=='br'){streak++;if(streak==5){k='gb';streak=0}}else streak=0;
   cls[j]=k;cnt[k]++});
  const n=Math.ceil(hist.length/2);
  ACC=Math.round((cnt.gb+cnt.br+cnt.ex+cnt.gd)/n*100);
  BEST=Math.max(ACC,+localStorage.getItem('cc_best')||0);localStorage.setItem('cc_best',BEST);
  $('pg').style.display='none';$('main').style.display='grid';
  rebuild();show(0)}

 function rebuild(){
  $('stats').innerHTML='<h3>'+t('stats')+'</h3><div style="font-size:2.2rem">'+ACC+'%</div><small>'+t('acc')+'</small><hr><div class="row">'+K.map(k=>'<span class="row" title="'+k[st.lang=='ar'?3:2]+'">'+face(k[0],'30px')+'<b>'+cnt[k[0]]+'</b></span>').join('')+'</div><hr><small>'+t('best')+'</small><div style="font-size:1.4rem">'+BEST+'%</div>';
  let h='';
  for(let i=0;i<hist.length;i+=2){
   h+='<div class="mr">'+face(cls[i],'26px')+'<span>'+(i/2+1)+'.</span><span class="mv" id="m'+i+'" onclick="show('+(i+1)+')">'+hist[i].san+'</span>'+(hist[i+1]?'<span class="mv" id="m'+(i+1)+'" onclick="show('+(i+2)+')">'+hist[i+1].san+'</span>':'')+'</div>'}
  $('mv').innerHTML=h}

 function txt(j){
  if(!j)return t('hi');
  const m=hist[j-1];
  if(m.color=='b')return D.cat+(st.lang=='ar'?' لعب ':' played ')+m.san+'.';
  return M[cls[j-1]][st.lang=='ar'?1:0].replace('{m}',m.san).replace('{b}',bestSan(j-1)).replace('{l}',(loss[j-1]/100).toFixed(1))}

 function show(j){
  j=Math.max(0,Math.min(hist.length,j));cur=j;
  const g2=new Chess(fens[j]),cc=CC[D.cat]||['#eee','#777'],lm=j?hist[j-1]:null;
  let h='';
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
   const n='abcdefgh'[x]+(8-y);
   h+='<div class="sq'+(lm&&(n==lm.from||n==lm.to)?' l':'')+'" style="left:'+x*12.5+'%;top:'+y*12.5+'%;background:'+((x+y)%2?cc[1]:cc[0])+'"></div>';
   const p=g2.get(n);
   if(p)h+='<div class="pc p'+p.color+'" style="left:'+x*12.5+'%;top:'+y*12.5+'%">'+(st.px?pix(p.type,p.color):GL[p.type]+'\uFE0E')+'</div>'}
  const k=lm&&lm.color=='w'?cls[j-1]:null;
  let arrow='',bdg='';
  if(k&&['in','mi','bl'].includes(k)&&B[j-1]){
   const u=B[j-1],c=s=>[s.charCodeAt(0)-96.5,8.5-s[1]],a=c(u.slice(0,2)),b=c(u.slice(2,4));
   arrow='<svg id="ar" viewBox="0 0 8 8"><line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#22d3ee" stroke-width=".2" stroke-linecap="round" opacity=".85"/><circle cx="'+b[0]+'" cy="'+b[1]+'" r=".28" fill="#22d3ee" opacity=".85"/></svg>'}
  if(k){const x=lm.to.charCodeAt(0)-97,y=8-+lm.to[1];
   bdg='<div class="bdg" style="left:'+((x+1)*12.5-7.5)+'%;top:'+(y*12.5)+'%">'+face(k,'100%')+'</div>'}
  $('bd').innerHTML=h+arrow+bdg;
  type(txt(j));
  document.querySelectorAll('.mv').forEach(e=>e.classList.remove('on'));
  if(j&&$('m'+(j-1)))$('m'+(j-1)).classList.add('on');
  const e=E2[j]/100;$('evn').textContent=(e>=0?'+':'')+e.toFixed(1)}

 function auto(){
  if(timer){clearInterval(timer);timer=null;$('pl').textContent='▶';return}
  $('pl').textContent='⏸';
  timer=setInterval(()=>{if(cur>=hist.length){auto();return}show(cur+1)},2200)}
 document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')show(cur+1);if(e.key=='ArrowLeft')show(cur-1)});

 window.show=show;window.auto=auto;window.hist=hist;
 Object.defineProperty(window,'cur',{get:()=>cur});
 window.again=()=>{rebuild();show(cur)};

 let i=0,cp=0,mt=null,w;
 function run(){
  $('pg').textContent=t('ana')+' '+i+'/'+fens.length;
  cp=0;mt=null;
  const z=new Chess(fens[i]);
  if(z.game_over()){
   E2[i]=z.in_checkmate()?(z.turn()=='w'?-1000:1000):0;B[i]='';i++;
   if(i<fens.length)run();else done();
   return}
  w.postMessage('position fen '+fens[i]);
  w.postMessage('go movetime 180')}
 fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js').then(x=>x.text()).then(x=>{
  w=new Worker(URL.createObjectURL(new Blob([x],{type:'text/javascript'})));
  w.onmessage=e=>{
   const l=String(e.data),m=l.match(/score (cp|mate) (-?\d+)/);
   if(m){cp=m[1]=='cp'?+m[2]:0;mt=m[1]=='mate'?+m[2]:null}
   if(l.startsWith('bestmove')){
    const s=fens[i].split(' ')[1]=='w'?1:-1;
    const v=mt!==null?(mt>0?1000:-1000):cp;
    E2[i]=Math.max(-1000,Math.min(1000,s*v));B[i]=l.split(' ')[1];
    i++;
    if(i<fens.length)run();else done()}};
  w.postMessage('uci');run()
 }).catch(()=>{$('pg').textContent=t('err')})
}

/* settings */
$('sb').onclick=()=>$('modal').style.display='flex';
$('bx').onclick=()=>$('modal').style.display='none';
$('bl').onclick=()=>{st.lang=st.lang=='en'?'ar':'en';save();ui();if(window.again)again()};
$('bm').onclick=()=>{st.music=!st.music;save();st.music?mu.play().catch(()=>{}):mu.pause();ui()};
$('bs').onclick=()=>{st.sfx=!st.sfx;save();ui()};
$('bp').onclick=()=>{st.px=!st.px;save();ui();if(window.again)again()};
</script>
</body>
</html>
