<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Chess - Gothic Fantasy Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#100D18;--dp:#211333;--mg:#7545B8;--gd:#C5A66A;--sv:#C9C5D8;--rd:#A92D45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--sv);font-family:Cairo,system-ui,sans-serif}
.scr{display:none;position:relative;min-height:100vh}.scr.on{display:block}
.fr{position:relative;background:linear-gradient(160deg,#241638,#150f22);border:2px solid var(--gd);border-radius:8px;box-shadow:0 0 0 2px #0a0710,inset 0 0 0 1px rgba(197,166,106,.3),0 8px 22px rgba(0,0,0,.65)}
.fr::before,.fr::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--gd)}
.fr::before{top:-5px;inset-inline-start:-5px;border-inline-end:0;border-bottom:0}
.fr::after{bottom:-5px;inset-inline-end:-5px;border-inline-start:0;border-top:0}
.pad{padding:10px 12px}
.bt{font:700 1rem Cairo,sans-serif;color:#efe3c8;background:linear-gradient(#34205a,#1d1233);border:2px solid var(--gd);border-radius:8px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #0a0710,0 0 12px rgba(117,69,184,.4);text-decoration:none;display:inline-block}
.bt:active{transform:translateY(2px)}.bt:disabled{opacity:.35;cursor:default}
#top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;position:relative;z-index:5}
#top h1{margin:0;font-size:clamp(.9rem,3vw,1.5rem);color:var(--gd);letter-spacing:1px}
#intro.on{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#2b1a4a,var(--bg) 70%)}
#intro h2{font-size:clamp(1.6rem,6vw,3rem);color:var(--gd);text-shadow:0 0 24px var(--mg);margin:0 0 14px}
#story{max-width:560px;line-height:2;min-height:120px;font-size:1.05rem}
#mapwrap{overflow:auto;padding:0 0 14px}
#world{position:relative;width:max(100%,860px);aspect-ratio:3/2;margin:auto;border:3px solid var(--gd);box-shadow:0 0 0 3px #0a0710,inset 0 0 60px rgba(0,0,0,.7);overflow:hidden;direction:ltr;background:#17112a url(world_map.jpeg) center/cover}
#world svg.wm{position:absolute;inset:0;width:100%;height:100%}
.fogm{position:absolute;left:-30%;width:160%;height:26%;background:radial-gradient(ellipse,rgba(200,190,230,.22),transparent 65%);animation:drift 22s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translateX(14%)}}
.nd{position:absolute;transform:translate(-50%,-50%);width:clamp(110px,15%,170px);text-align:center;z-index:3;cursor:pointer;direction:rtl}
.md{position:relative;width:clamp(64px,8.5vw,104px);aspect-ratio:1;margin:0 auto -14px;border-radius:50%;border:3px solid var(--gd);background:radial-gradient(circle,#3a2660,#150f22);box-shadow:0 0 0 3px #0a0710,0 6px 14px rgba(0,0,0,.7);overflow:hidden;display:flex;align-items:center;justify-content:center}
.md img{width:100%;height:100%;object-fit:contain}.md svg{width:68%;height:68%}
.nd.av .md{box-shadow:0 0 0 3px #0a0710,0 0 22px 6px rgba(197,166,106,.85);animation:pulse 1.8s ease-in-out infinite}
.nd.pg .md{box-shadow:0 0 0 3px #0a0710,0 0 22px 6px rgba(117,69,184,.95)}
.nd.cl .md{border-color:#7fe0a0}
.nd.lk{cursor:not-allowed}.nd.lk .md{filter:saturate(.35) brightness(.8)}
@keyframes pulse{50%{box-shadow:0 0 0 3px #0a0710,0 0 10px 2px rgba(197,166,106,.5)}}
.pq{position:relative;background:linear-gradient(#2a1a45,#150f22);border:2px solid var(--gd);border-radius:6px;padding:16px 4px 5px;line-height:1.25;box-shadow:0 4px 10px rgba(0,0,0,.7)}
.pq small{display:block;font-size:clamp(.55rem,1.25vw,.72rem);color:var(--sv)}
.pq b{display:block;font-size:clamp(.65rem,1.5vw,.9rem);color:#f3e7c8}
.pq i{display:block;font-style:normal;font-size:clamp(.55rem,1.2vw,.7rem);color:var(--gd)}
.rk{position:absolute;top:-10px;inset-inline-end:-6px;background:#150f22;border:2px solid var(--gd);color:var(--gd);font-weight:900;font-size:.75rem;width:26px;height:26px;border-radius:50%;line-height:22px}
.sttag{display:inline-block;font-size:.6rem;padding:0 6px;border-radius:8px;margin-top:2px;background:#0a0710}
.av .sttag{color:var(--gd)}.cl .sttag{color:#7fe0a0}.pg .sttag{color:#b99cff}.lk .sttag{color:#8a849c}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;background:#150f22;border:2px solid var(--gd);padding:8px 16px;border-radius:8px;display:none}
#cine{overflow:hidden}
#carena{position:absolute;inset:0;animation:zm 24s ease-in-out infinite alternate}
@keyframes zm{to{transform:scale(1.08)}}
#cimg{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);height:min(60vh,520px);max-width:90%;object-fit:contain;filter:drop-shadow(0 0 26px var(--mg));opacity:0;animation:fin 2.2s .4s forwards}
@keyframes fin{to{opacity:1}}
#dlg{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:min(94%,760px);padding:12px 16px;text-align:start;background:rgba(14,9,22,.9)}
#dnm{font-size:1.2rem;font-weight:900;color:var(--gd)}#dtt{font-size:.85rem;margin-bottom:6px}
#dtx{min-height:5.5em;line-height:1.9}
#cbt{position:absolute;top:12px;inset-inline-start:12px;z-index:3}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:70;transition:opacity .6s}
.ar{position:absolute;inset:0;overflow:hidden}.ar>svg{position:absolute;inset:0;width:100%;height:100%}
.fgf{position:absolute;left:-20%;right:-20%;bottom:0;height:45%;background:radial-gradient(ellipse at 30% 100%,rgba(255,255,255,.18),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(255,255,255,.12),transparent 55%);animation:drift 16s ease-in-out infinite alternate}
.pt{position:absolute;width:6px;height:10px;border-radius:50%;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes rise{to{transform:translateY(-115vh)}}
#fight{overflow-x:hidden}
#farena{position:fixed;inset:0;z-index:0}
#fg{position:relative;z-index:2;display:grid;gap:10px;max-width:1300px;margin:auto;padding:8px 10px;grid-template-columns:270px minmax(0,1fr) 270px;grid-template-areas:"ft ft ft" "fl fm fr" "fb fb fb"}
#ft{grid-area:ft;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(14,9,22,.88)}
#fth{width:54px;height:54px;object-fit:contain;border:2px solid var(--gd);border-radius:50%;background:#150f22}
#ftx{flex:1;min-width:150px}#ftx small{color:var(--gd)}#ftx b{display:block;font-size:1.15rem;color:#f3e7c8}
.bar{position:relative;height:20px;border:2px solid var(--gd);border-radius:4px;background:#0a0710;overflow:hidden;min-width:150px;flex:2}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .4s}
.bar.red i{background:linear-gradient(#d04560,var(--rd))}.bar.pur i{background:linear-gradient(#9a6ae0,var(--mg))}
.bar span{position:absolute;inset:0;text-align:center;font-size:.72rem;line-height:16px;color:#fff}
.clk{font-weight:900;font-size:1.05rem;color:var(--gd)}.clk.act{color:#fff;text-shadow:0 0 8px var(--mg)}
#fl{grid-area:fl;display:flex;flex-direction:column;gap:10px;background:none}
#fm{grid-area:fm;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
#fr{grid-area:fr;display:flex;flex-direction:column;gap:10px}
#fb{grid-area:fb;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pc2{display:flex;gap:10px;align-items:center;background:rgba(14,9,22,.88)}
#pimg{width:64px;height:64px;object-fit:contain;border:2px solid var(--gd);border-radius:50%;background:#150f22;flex:none}
details.fr{background:rgba(14,9,22,.88)}summary{cursor:pointer;color:var(--gd);font-weight:700}
#mlog,#elog{max-height:150px;overflow:auto;font-size:.8rem;line-height:1.7;margin-top:6px}
#elog div::before{content:"◆ ";color:var(--mg)}
#fbig{height:min(24vh,230px);max-width:100%;object-fit:contain;filter:drop-shadow(0 0 20px var(--mg))}
#tn{padding:5px 26px;font-weight:900;background:rgba(14,9,22,.88)}#tn.mine{color:var(--gd)}#tn.theirs{color:#e07a8f}
#bw{position:relative;width:min(100%,max(300px,calc(100vh - 360px)));padding:8px;background:linear-gradient(#4a3470,#241638);border:3px solid var(--gd);border-radius:6px;box-shadow:0 0 0 3px #0a0710,0 14px 34px rgba(0,0,0,.75)}
#bd{position:relative;width:100%;aspect-ratio:1;direction:ltr;user-select:none;touch-action:none}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.lt{background:linear-gradient(135deg,#dcd7ea,#b8b2cd)}.sq.dk{background:linear-gradient(135deg,#4a3470,#2a1c46)}
.sq.l{box-shadow:inset 0 0 0 100px rgba(197,166,106,.5)}.sq.s{box-shadow:inset 0 0 0 100px rgba(197,166,106,.8)}
.sq.d::after{content:"";position:absolute;inset:34%;border-radius:50%;background:rgba(117,69,184,.85);box-shadow:0 0 8px #b99cff}
.sq.cp::after{inset:6%;background:none;border:4px solid rgba(169,45,69,.9);box-shadow:none}
.sq.ck{box-shadow:inset 0 0 0 100px rgba(169,45,69,.7)}
.sq.fi{box-shadow:inset 0 0 0 100px rgba(255,110,30,.65)}.sq.fw{box-shadow:inset 0 0 0 4px #ff9a3c}
.sq.dc{box-shadow:inset 0 0 0 3px rgba(185,156,255,.85)}.sq.hn{box-shadow:inset 0 0 0 100px rgba(90,220,150,.5)}
.pc{position:absolute;width:12.5%;height:12.5%;transition:left .18s ease,top .18s ease,opacity .25s;cursor:grab;z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.55))}
.pc.drag{transition:none;z-index:9;cursor:grabbing}
.fx{position:absolute;width:12.5%;height:12.5%;z-index:5;pointer-events:none;border-radius:50%;animation:bst .5s forwards}
@keyframes bst{from{box-shadow:0 0 0 0 rgba(255,220,150,.9)}to{box-shadow:0 0 0 40px rgba(255,220,150,0);transform:scale(1.5)}}
#ban{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:2.4rem;font-weight:900;color:#fff;text-shadow:0 0 22px var(--rd),0 0 8px #000;z-index:8;pointer-events:none}
#res{display:none;position:fixed;inset:0;z-index:80;background:rgba(8,5,14,.9);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
#res h2{font-size:clamp(2rem,8vw,4rem);margin:0;color:var(--gd);text-shadow:0 0 30px var(--mg)}
#res.lose h2{color:var(--rd)}
@media(max-width:1000px){
 #fg{grid-template-columns:1fr;grid-template-areas:"ft" "fm" "fb" "fl" "fr"}
 #fbig{display:none}#bw{width:100%}
}
</style>
</head>
<body>
<div id="top"><a id="bk" class="bt" href="index.html"></a><h1 id="ttl"></h1><button id="bl" class="bt"></button></div>

<section id="intro" class="scr"><h2 id="ih"></h2><div id="story" class="fr pad"></div><button id="go" class="bt" style="margin-top:16px"></button></section>

<section id="map" class="scr"><div id="mapwrap"><div id="world"></div></div></section>

<section id="cine" class="scr">
 <div id="carena"></div><img id="cimg">
 <div id="cbt"><button id="skip" class="bt"></button></div>
 <div id="dlg" class="fr"><div id="dnm"></div><div id="dtt"></div><div id="dtx"></div><button id="cgo" class="bt" style="display:none;margin-top:8px"></button></div>
</section>

<section id="fight" class="scr">
 <div id="farena"></div>
 <div id="fg">
  <div id="ft" class="fr pad">
   <img id="fth">
   <div id="ftx"><small id="fst"></small><b id="fnm"></b><span id="ftt"></span></div>
   <div class="bar red"><i id="hpb"></i><span id="hpbt"></span></div>
   <span id="bclk" class="clk"></span>
   <button id="gb" class="bt" style="padding:6px 12px">A/EN</button><button id="xb" class="bt" style="padding:6px 12px"></button>
  </div>
  <aside id="fl">
   <div class="fr pad pc2"><img id="pimg"><div style="flex:1"><b id="pnm"></b><div class="bar pur" style="margin:4px 0"><i id="php"></i><span id="phpt"></span></div><span id="pclk" class="clk"></span></div></div>
   <details class="fr pad" open><summary id="mls"></summary><div id="mlog"></div></details>
   <details class="fr pad" open><summary id="els"></summary><div id="elog"></div></details>
  </aside>
  <main id="fm">
   <img id="fbig">
   <div id="tn" class="fr"></div>
   <div id="bw"><div id="bd"></div><div id="ban"></div></div>
  </main>
  <aside id="fr"><div class="fr pad" id="binf"></div><div class="fr pad" id="abp"></div></aside>
  <div id="fb"><button id="und" class="bt"></button><button id="hnt" class="bt"></button><button id="sur" class="bt"></button></div>
 </div>
</section>

<div id="res"><h2 id="rh"></h2><p id="rp" style="max-width:480px"></p><div><button id="rr" class="bt"></button> <button id="rm" class="bt"></button></div></div>
<div id="toast"></div><div id="fade"></div>

<script>
const $=id=>document.getElementById(id);
const R=a=>a[Math.floor(Math.random()*a.length)];
const S=JSON.parse(localStorage.getItem('cc')||'{}');
const st={lang:S.lang||'ar',music:S.music!==false,sfx:S.sfx!==false};
const save=()=>localStorage.setItem('cc',JSON.stringify(Object.assign(JSON.parse(localStorage.getItem('cc')||'{}'),st)));
const L=x=>x[st.lang=='ar'?1:0];
const T={
 title:['GOTHIC FANTASY CHESS','قلعة الشطرنج الملعونة'],back:['Back','رجوع'],start:['Begin the journey','ابدأ الرحلة'],
 story:['Lucian Dracula holds your little brother in his castle. Six guardians block the road through the Cursed Chess Kingdom. Defeat them one by one, face Lucian, and bring your brother home.','لوسيان دراكولا يحتجز أخاك الصغير في قلعته. ستة حراس يسدّون الطريق في مملكة الشطرنج الملعونة. اهزمهم واحداً بعد الآخر، وواجه لوسيان، وأعد أخاك إلى البيت.'],
 end:['Lucian lowers his head. "Your brother is safe. I only needed to know who was coming for him. The reason is a story for another night." TO BE CONTINUED.','خفض لوسيان رأسه. «أخوك بخير. كنت أحتاج فقط أن أعرف من الذي يأتي من أجله. أما السبب فهو حكاية لليلة أخرى.» يتبع…'],
 begin:['The Gate','البداية'],lk:['Locked','مقفلة'],av:['Available','متاحة'],pg:['In progress','قيد اللعب'],cl:['Cleared','مكتملة'],
 lockmsg:['Defeat the previous guardian first.','اهزم الحارس السابق أولاً.'],skip:['Skip scene','تخطي المشهد'],go:['Enter the arena','ادخل الساحة'],
 yourT:['Your turn','دورك'],enT:['Enemy turn','دور العدو'],undo:['Undo','تراجع'],hint:['Hint','تلميح'],sur:['Surrender','استسلام'],exit:['Map','الخريطة'],
 mls:['Move log','سجل الحركات'],els:['Battle log','سجل المعركة'],abil:['Boss abilities','قدرات الزعيم'],diff:['Difficulty','الصعوبة'],iq:['Intelligence','الذكاء'],rank:['Rank','الرتبة'],time:['Time each','وقت كل طرف'],
 win:['VICTORY','انتصار'],lose:['DEFEAT','هزيمة'],draw:['DRAW','تعادل'],winT:['The road ahead opens.','انفتح الطريق أمامك.'],loseT:['The guardian still stands. Try again.','الحارس ما زال واقفاً. حاول مرة ثانية.'],
 tw:['The boss ran out of time.','انتهى وقت الزعيم.'],tl:['Your time ran out.','انتهى وقتك.'],check:['CHECK','كش'],mate:['CHECKMATE','كش مات'],retry:['Retry','أعد المحاولة'],cont:['Continue','تابع'],
 fight:['The battle against {b} begins.','بدأت المعركة ضد {b}.'],you:['You','أنت'],
 e_tri:['{b} charges the Triple Attack: next turn he strikes with every head.','{b} يشحن الهجوم الثلاثي: في دوره القادم يضرب برؤوسه كلها.'],
 e_triGo:['Triple Attack!','الهجوم الثلاثي!'],
 e_leap:['{b} prepares an Air Leap flank strike.','{b} يستعد لقفزة جوية على الأجنحة.'],e_leapGo:['Air Leap!','القفزة الجوية!'],
 e_sh:['Spiked Shield: the boss punishes your capture.','الدرع الشوكي: الزعيم يعاقب أخذك للقطعة.'],
 e_fw:['Flame warning: square {s} will ignite on the next boss move.','تحذير: المربع {s} سيشتعل في حركة الزعيم القادمة.'],
 e_fi:['Flame! Square {s} is burning for two turns. Stepping on it costs 10 seconds.','لهب! المربع {s} يحترق دورين. الوقوف عليه يكلّفك 10 ثوانٍ.'],
 e_bn:['You stepped into the flame: -10 seconds.','دخلت اللهب: -10 ثوانٍ.'],
 e_il:['Illusion: some purple-ringed squares are false.','الوهم: بعض المربعات ذات الحلقة البنفسجية خادعة.'],
 e_la:['The Last King turns aggressive.','الملك الأخير يتحول إلى الهجوم.'],e_ld:['The Last King turns defensive.','الملك الأخير يتحول إلى الدفاع.'],
 e_un:['Undo used: -20 seconds.','استُخدم التراجع: -20 ثانية.'],e_hn:['Hint used: -10 seconds.','استُخدم التلميح: -10 ثانية.']};
const t=k=>L(T[k]);
const ST=[['Stage 1','المرحلة الأولى'],['Stage 2','المرحلة الثانية'],['Stage 3','المرحلة الثالثة'],['Stage 4','المرحلة الرابعة'],['Stage 5','المرحلة الخامسة'],['Final Stage','المرحلة الأخيرة']];
/* boss pictures: change a file name here if a picture belongs to a different boss */
const IMGS=['IMG_1937.jpeg','IMG_1938.jpeg','IMG_1939.jpeg','IMG_1934.jpeg','IMG_1935.jpeg','IMG_1936.jpeg'];
/* e = how well he plays (intelligence), the rank letter and difficulty are separate */
const BS=[
{n:['Theragon','ثيراغون'],tt:['Guardian of the White Gate','حارس البوابة البيضاء'],rk:'E',df:['Easy','سهلة'],iq:['Low','منخفض'],e:1000,
 ab:[['Triple Attack','الهجوم الثلاثي'],['Every third move he strikes with all three heads: captures and checks come first. He warns you one turn ahead.','كل نقلة ثالثة يضرب برؤوسه الثلاثة: الأخذ والكش أولاً. وينبهك قبلها بدور.']],
 q:['Three heads watch you, six eyes that never blink. Nobody crossed this gate without losing everything. Show me a mind worth saving!','ثلاثة رؤوس تراقبك… وستة عيون لا ترمش. أنا حارس هذه البوابة، ولم يعبر أحد من هنا إلا بعد أن فقد كل شيء. أرني إن كنت تملك عقلاً يستحق النجاة!']},
{n:['Valdrix','فالدريكس'],tt:['Lord of the Black Sky','سيد السماء السوداء'],rk:'D',df:['Medium','متوسطة'],iq:['Medium','متوسط'],e:1400,
 ab:[['Air Leap','القفزة الجوية'],['Every fourth move he strikes from the edges of the board with a rook, bishop or knight. He warns you one turn ahead.','كل نقلة رابعة يضرب من أطراف الرقعة بقلعة أو فيل أو حصان. وينبهك قبلها بدور.']],
 q:['You passed the gatekeeper? Do not let that fool you. I do not need the ground to fight you. Fly with your mind... before you fall!','هاه… لقد تجاوزت حارس البوابة؟ لا تجعل ذلك يخدعك. أنا لا أحتاج إلى الأرض كي أقاتلك، ولا أحتاج إلى الاقتراب منك حتى أسحقك. حلّق بعقلك إن استطعت… قبل أن تسقط!']},
{n:['Garmath','غارماث'],tt:['Fortress of Thorns','حصن الأشواك'],rk:'C',df:['Hard','صعبة'],iq:['High (defense)','عالٍ (دفاع)'],e:2000,
 ab:[['Spiked Shield','الدرع الشوكي'],['When you capture a piece he can recapture, he always recaptures at once. Reckless trades are punished.','حين تأخذ قطعة يستطيع استعادتها، يستعيدها فوراً. فتُعاقَب المبادلات المتهورة.']],
 q:['Come closer... no, do not retreat now. Everyone who tried to break my defense left shattered pieces behind. Show me how you beat an unbreakable fortress.','اقترب… لا، لا تتراجع الآن. كل من حاول اختراق دفاعي ترك خلفه قطعاً محطمة. أرني كيف ستنتصر على حصن لا يمكن اختراقه.']},

/* background removal for the boss pictures */
const CC={};
function cln(src,cb){
 if(CC[src])return cb(CC[src]);
 const im=new Image();
 im.onload=()=>{try{
  const k=Math.min(1,520/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data,cs=[0,w-1,(h-1)*w,h*w-1];
  const bg=[0,1,2].map(j=>cs.reduce((a,i)=>a+p[i*4+j],0)/4);
  const dist=i=>Math.hypot(p[i*4]-bg[0],p[i*4+1]-bg[1],p[i*4+2]-bg[2]);
  const seen=new Uint8Array(w*h),stack=[];
  const push=i=>{if(!seen[i]&&dist(i)<60){seen[i]=1;stack.push(i)}};
  for(let a=0;a<w;a++){push(a);push((h-1)*w+a)}
  for(let b=0;b<h;b++){push(b*w);push(b*w+w-1)}
  while(stack.length){const i=stack.pop(),cx=i%w,cy=(i/w)|0;
   if(cx>0)push(i-1);if(cx<w-1)push(i+1);if(cy>0)push(i-w);if(cy<h-1)push(i+w)}
  let keep=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)keep[i]=seen[i]?0:1;
  for(let r=0;r<3;r++){const nk=keep.slice();
   for(let i=0;i<w*h;i++){if(keep[i])continue;const cx=i%w,cy=(i/w)|0;
    if((cx>0&&keep[i-1])||(cx<w-1&&keep[i+1])||(cy>0&&keep[i-w])||(cy<h-1&&keep[i+w]))nk[i]=1}
   keep=nk}
  for(let i=0;i<w*h;i++)p[i*4+3]=keep[i]?255:0;
  x.putImageData(d,0,0);CC[src]=c.toDataURL('image/png');cb(CC[src])
 }catch(e){cb(src)}};
 im.onerror=()=>cb(src);im.src=src}

 cln(IMGS[bi],u=>{$('fth').src=u;$('fbig').src=u});cln('IMG_1785.jpeg',u=>$('pimg').src=u);
 $('mlog').textContent='';$('elog').textContent='';$('res').style.display='none';
 fillF();buildBoard();marks();elog(t('fight').replace('{b}',L(b.n)));
 clearInterval(tick);tick=setInterval(tk,100);hud()}
function fillF(){
 const b=BS[bi];
 $('fst').textContent=L(ST[bi]);$('fnm').textContent=L(b.n);$('ftt').textContent=L(b.tt);
 $('pnm').textContent=t('you');$('mls').textContent=t('mls');$('els').textContent=t('els');$('xb').textContent=t('exit');
 $('und').textContent=t('undo');$('hnt').textContent=t('hint');$('sur').textContent=t('sur');
 $('binf').innerHTML='<b style="color:var(--gd)">'+L(b.n)+'</b><div>'+t('rank')+': <b>'+b.rk+'</b></div><div>'+t('diff')+': '+L(b.df)+'</div><div>'+t('iq')+': '+L(b.iq)+'</div><div>'+t('time')+': '+fmt(TM[bi]*1000)+'</div>';
 $('abp').innerHTML='<b style="color:var(--gd)">'+t('abil')+'</b><div style="font-weight:900;margin:6px 0 2px">'+L(b.ab[0])+'</div><div style="font-size:.85rem;line-height:1.7">'+L(b.ab[1])+'</div>'}
function buildBoard(){
 const bd=$('bd');bd.innerHTML='';
 for(let y=0;y<8;y++)for(let x=0;x<8;x++){const s=document.createElement('div');s.className='sq '+((x+y)%2?'dk':'lt');s.id='q'+FL[x]+(8-y);s.style.left=x*12.5+'%';s.style.top=y*12.5+'%';bd.appendChild(s)}
 G.board().forEach((row,y)=>row.forEach((p,x)=>{if(p)addPc(p.color,p.type,FL[x]+(8-y))}))}
function addPc(c,ty,s){const e=document.createElement('img');e.className='pc';e.src=PU(c,ty);e.draggable=false;pos(e,s);$('bd').appendChild(e);return e}
function kingSq(c){const b=G.board();for(let y=0;y<8;y++)for(let x=0;x<8;x++){const p=b[y][x];if(p&&p.type=='k'&&p.color==c)return FL[x]+(8-y)}}
function marks(){
 document.querySelectorAll('#bd .sq').forEach(e=>e.classList.remove('l','s','d','cp','ck','fi','fw','dc','hn'));
 const add=(s,c)=>{const e=$('q'+s);if(e)e.classList.add(c)};
 last.forEach(s=>add(s,'l'));hl.forEach(s=>add(s,'hn'));decoy.forEach(s=>add(s,'dc'));
 if(ab.warn)add(ab.warn,'fw');if(ab.fire)add(ab.fire.sq,'fi');
 if(sel){add(sel,'s');G.moves({square:sel,verbose:true}).forEach(m=>{add(m.to,'d');if(G.get(m.to)||m.flags.includes('e'))add(m.to,'cp')})}
 if(!over&&G.in_check())add(kingSq(G.turn()),'ck')}
function sqFrom(ev){const r=$('bd').getBoundingClientRect(),x=Math.floor((ev.clientX-r.left)/r.width*8),y=Math.floor((ev.clientY-r.top)/r.height*8);return(x<0||x>7||y<0||y>7)?null:FL[x]+(8-y)}
const legal=(f,to)=>G.moves({square:f,verbose:true}).some(m=>m.to==to);
function follow(ev){const r=$('bd').getBoundingClientRect();drag.e.style.left=((ev.clientX-r.left)/r.width*100-6.25)+'%';drag.e.style.top=((ev.clientY-r.top)/r.height*100-6.25)+'%'}
$('bd').addEventListener('pointerdown',ev=>{
 if(over||busy||turn!='p')return;
 const s=sqFrom(ev);if(!s)return;ev.preventDefault();
 if(sel&&sel!=s&&legal(sel,s)){playerMove(sel,s);return}
 const p=G.get(s);
 if(p&&p.color=='w'){sel=s;hl=[];marks();const e=pcAt(s);drag={e,from:s};e.classList.add('drag');follow(ev);$('bd').setPointerCapture(ev.pointerId)}
 else{sel=null;marks()}});
$('bd').addEventListener('pointermove',ev=>{if(drag)follow(ev)});
$('bd').addEventListener('pointerup',ev=>{
 if(!drag)return;const d=drag;drag=null;d.e.classList.remove('drag');
 const to=sqFrom(ev);
 if(to&&to!=d.from&&legal(d.from,to))playerMove(d.from,to);else pos(d.e,d.from)});
function animate(m){
 const e=pcAt(m.from);if(!e)return;
 if(m.captured){const ce=pcAt(m.flags.includes('e')?m.to[0]+m.from[1]:m.to);if(ce){ce.dataset.dead=1;ce.style.opacity=0;setTimeout(()=>ce.remove(),260)}
  const f=document.createElement('div');f.className='fx';f.style.left=(m.to.charCodeAt(0)-97)*12.5+'%';f.style.top=(8-+m.to[1])*12.5+'%';$('bd').appendChild(f);setTimeout(()=>f.remove(),520)}
 if(m.flags.includes('k')||m.flags.includes('q')){const k=m.flags.includes('k'),r=m.color=='w'?'1':'8',re=pcAt((k?'h':'a')+r);if(re)pos(re,(k?'f':'d')+r)}
 e.classList.remove('drag');pos(e,m.to);
 if(m.promotion)e.src=PU(m.color,m.promotion)}
function logMove(m){mlog.push(m.san);let h='';for(let i=0;i<mlog.length;i+=2)h+='<div>'+(i/2+1)+'. '+mlog[i]+(mlog[i+1]?'  '+mlog[i+1]:'')+'</div>';$('mlog').innerHTML=h;$('mlog').scrollTop=1e5}
function banner(k){const b=$('ban');b.textContent=t(k);b.style.display='flex';setTimeout(()=>b.style.display='none',1100)}
function playerMove(f,to){
 const m=G.move({from:f,to:to,promotion:'q'});if(!m)return;
 sel=null;hl=[];last=[m.from,m.to];lastP=m;animate(m);logMove(m);tone(m.captured?200:330,.08,.1);
 if(ab.fire&&ab.fire.sq==m.to){clk.p-=10000;elog(t('e_bn'))}
 if(after(m))return;
 turn='b';act='b';marks();hud();setTimeout(bossMove,DL[bi]*(.6+Math.random()*.8))}
function after(m){
 marks();hud();
 if(G.game_over()){banner(G.in_checkmate()?'mate':'check');if(G.in_checkmate())fin(m.color=='w'?'w':'l');else fin('d');return true}
 if(G.in_check()){banner('check');tone(880,.15,.1)}
 return false}
function fin(k){
 if(over)return;over=true;act=null;clearInterval(tick);
 const win=k=='w'||k=='tw';
 adv.play=null;if(win&&bi==adv.c){adv.c++;if(bi==5)adv.end=1}saveA();
 tone(win?784:150,.5,.12);
 $('res').className=win?'':'lose';$('rh').textContent=win?t('win'):k=='d'?t('draw'):t('lose');
 $('rp').textContent=(win?t('winT'):k=='d'?'':t('loseT'))+(k=='tw'?' '+t('tw'):k=='tl'?' '+t('tl'):'');
 $('rr').style.display=win?'none':'inline-block';$('rr').textContent=t('retry');$('rm').textContent=win?t('cont'):t('exit');
 $('res').style.display='flex';hud()}
function tk(){if(over||!act)return;clk[act]-=100;clocks();if(clk[act]<=0)fin(act=='b'?'tw':'tl')}
function clocks(){$('bclk').textContent=fmt(clk.b);$('pclk').textContent=fmt(clk.p);$('pclk').className='clk'+(act=='p'?' act':'');$('bclk').className='clk'+(act=='b'?' act':'')}
function hud(){
 const bh=over&&G.in_checkmate()&&G.turn()=='b'?0:Math.round(1000*mat('b')/39),ph=over&&G.in_checkmate()&&G.turn()=='w'?0:Math.round(1000*mat('w')/39);
 $('hpb').style.width=bh/10+'%';$('hpbt').textContent=bh+' / 1000';$('php').style.width=ph/10+'%';$('phpt').textContent=ph+' / 1000';
 $('tn').textContent=over?'':t(turn=='p'?'yourT':'enT');$('tn').className='fr '+(turn=='p'?'mine':'theirs');
 $('und').disabled=over||turn!='p'||undoL<=0||mlog.length<2;$('hnt').disabled=over||turn!='p'||hintsL<=0;
 $('und').textContent=t('undo')+' ('+undoL+')';$('hnt').textContent=t('hint')+' ('+hintsL+')';clocks()}
const sc=x=>(x.captured?V[x.captured]:0)+(x.san.includes('+')?1.5:0)+(x.san.includes('#')?99:0)-(x.captured?V[x.piece]*.1:0);
const bestOf=a=>a.slice().sort((p,q)=>sc(q)-sc(p))[0];
function bossMove(){
 if(over)return;
 const b=BS[bi],ms=G.moves({verbose:true}),n=bm+1;
 if(ab.fire&&--ab.fire.t<0)ab.fire=null;
 if(bi==3&&ab.warn){ab.fire={sq:ab.warn,t:2};elog(t('e_fi').replace('{s}',ab.warn));ab.warn=null}
 const play=m=>{
  G.move(m);bm++;last=[m.from,m.to];animate(m);logMove(m);tone(m.captured?200:300,.08,.1);
  decoy=[];
  if(bi==4&&Math.random()<.65){decoy=[0,1].map(()=>FL[Math.floor(Math.random()*8)]+(1+Math.floor(Math.random()*8)));if(!ab.il){ab.il=1;elog(t('e_il'))}}
  const nx=bm+1;
  if(bi==0&&nx%3==0)elog(t('e_tri').replace('{b}',L(b.n)));
  if(bi==1&&nx%4==0)elog(t('e_leap').replace('{b}',L(b.n)));
  if(bi==3&&nx%5==3){const es=[];for(let y=3;y<=6;y++)for(let x=0;x<8;x++){const s=FL[x]+y;if(!G.get(s))es.push(s)}if(es.length){ab.warn=R(es);elog(t('e_fw').replace('{s}',ab.warn))}}
  turn='p';act='p';busy=false;marks();hud();after(m)};
 const caps=ms.filter(x=>x.captured||x.san.includes('+')||x.san.includes('#'));
 const mt=ms.find(x=>x.san.includes('#'));if(mt)return play(mt);
 busy=true;
 if(bi==0&&n%3==0&&caps.length){elog(t('e_triGo'));return play(bestOf(caps))}
 if(bi==1&&n%4==0){const fl=ms.filter(x=>'rbn'.includes(x.piece)&&(x.to[0]=='a'||x.to[0]=='h'||x.to[1]=='1'||x.to[1]=='8'));if(fl.length){elog(t('e_leapGo'));return play(R(fl))}}
 if(bi==2&&lastP&&lastP.captured){const rc=ms.filter(x=>x.to==lastP.to&&x.captured);if(rc.length){elog(t('e_sh'));return play(rc.sort((p,q)=>V[p.piece]-V[q.piece])[0])}}
 if(bi==5){const df=mat('b')-mat('w'),ns=df<-2?'agg':df>2?'def':sty;if(ns!=sty&&ns!='mix'){elog(t(ns=='agg'?'e_la':'e_ld'))}sty=ns;if(sty=='agg'&&caps.length&&Math.random()<.5)return play(bestOf(caps))}
 if(bi==0&&caps.length&&Math.random()<.4)return play(bestOf(caps));
 if(bi==3&&Math.random()<.3)return play(caps.length?R(caps):R(ms));
 const rp=Math.min(.9,b.e<1500?(1500-b.e)/1500:0);
 if(Math.random()<rp)return play(R(ms));
 if(!eng||!eok)return play(R(ms));
 pnd=u=>play(ms.find(x=>x.from+x.to==(u||'').slice(0,4))||R(ms));
 setTimeout(()=>{if(pnd){const p=pnd;pnd=null;p('')}},6000);
 eng.postMessage('setoption name Skill Level value '+Math.max(0,Math.min(20,Math.round((b.e-1300)/85))));
 eng.postMessage('position fen '+G.fen());
 eng.postMessage('go movetime '+Math.round(Math.min(900,DL[bi]*.7)))}
$('und').onclick=()=>{
 if(over||turn!='p'||undoL<=0||mlog.length<2)return;
 G.undo();G.undo();mlog.pop();mlog.pop();undoL--;clk.p-=20000;bm=Math.max(0,bm-1);sel=null;last=[];hl=[];decoy=[];
 buildBoard();marks();elog(t('e_un'));$('mlog').textContent=mlog.join(' ');hud()};
$('hnt').onclick=()=>{
 if(over||turn!='p'||hintsL<=0)return;hintsL--;clk.p-=10000;elog(t('e_hn'));
 const ms=G.moves({verbose:true}),show=m=>{hl=[m.from,m.to];marks()};
 if(!eng||!eok){show(bestOf(ms));hud();return}
 pnd=u=>{const m=ms.find(x=>x.from+x.to==(u||'').slice(0,4));if(m)show(m)};
 eng.postMessage('setoption name Skill Level value 20');eng.postMessage('position fen '+G.fen());eng.postMessage('go movetime 500');hud()};
$('sur').onclick=()=>{if(!over)fin('l')};
$('xb').onclick=()=>{over=true;clearInterval(tick);adv.play=bi;saveA();renderMap()};
$('rr').onclick=()=>{$('res').style.display='none';enter()};
$('rm').onclick=()=>{$('res').style.display='none';if(adv.end&&!adv.shown){adv.shown=1;saveA();showEnd()}else renderMap()};
$('go').onclick=()=>{adv.seen=1;saveA();renderMap()};
$('cgo').onclick=$('skip').onclick=()=>enter();
function showEnd(){show('intro');$('ih').textContent='';say($('story'),t('end'));$('go').textContent=t('exit');$('go').onclick=renderMap}
function ui(){
 document.documentElement.lang=st.lang;document.documentElement.dir=st.lang=='ar'?'rtl':'ltr';
 $('bk').textContent=t('back');$('bl').textContent=st.lang=='ar'?'English':'العربية';$('ttl').textContent=t('title');
 $('ih').textContent=t('title');$('go').textContent=t('start');$('skip').textContent=t('skip');$('cgo').textContent=t('go')}
function rerender(){
 ui();const on=document.querySelector('.scr.on').id;
 if(on=='map')renderMap();else if(on=='fight'){fillF();hud();}else if(on=='cine')openBoss(bi);else if(on=='intro'&&!adv.seen){say($('story'),t('story'))}}
$('bl').onclick=$('gb').onclick=()=>{st.lang=st.lang=='ar'?'en':'ar';save();rerender()};
ui();
if(adv.seen)renderMap();else{show('intro');say($('story'),t('story'))}
</script>
</body>
