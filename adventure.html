function tone(f,d,v){if(!st.sfx)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d)}

/* removes the background of the boss pictures */
const CC={};
function cln(src,cb){
 if(CC[src])return cb(CC[src]);
 const im=new Image();
 im.onload=()=>{try{
  const k=Math.min(1,500/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data,cs=[0,w-1,(h-1)*w,h*w-1];
  const bg=[0,1,2].map(j=>cs.reduce((a,i)=>a+p[i*4+j],0)/4);
  const dist=i=>Math.hypot(p[i*4]-bg[0],p[i*4+1]-bg[1],p[i*4+2]-bg[2]);
  const seen=new Uint8Array(w*h),stack=[];
  const push=i=>{if(!seen[i]&&dist(i)<60){seen[i]=1;stack.push(i)}};
  for(let a=0;a<w;a++){push(a);push((h-1)*w+a)}
  for(let b=0;b<h;b++){push(b*w);push(b*w+w-1)}
  while(stack.length){const i=stack.pop(),cx=i%w,cy=(i/w)|0;
   if(cx>0)push(i-1);if(cx<w-1)push(i+1);if(cy>0)push(i-w);if(cy<h-1)push(i+w)}
  let keep=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)keep[i]=seen[i]?0:1;
  for(let r=0;r<3;r++){const nk=keep.slice();
   for(let i=0;i<w*h;i++){if(keep[i])continue;const cx=i%w,cy=(i/w)|0;
    if((cx>0&&keep[i-1])||(cx<w-1&&keep[i+1])||(cy>0&&keep[i-w])||(cy<h-1&&keep[i+w]))nk[i]=1}
   keep=nk}
  for(let i=0;i<w*h;i++)p[i*4+3]=keep[i]?255:0;
  x.putImageData(d,0,0);CC[src]=c.toDataURL('image/png');cb(CC[src])
 }catch(e){cb(src)}};
 im.onerror=()=>cb(src);im.src=src}

function show(id){
 document.querySelectorAll('.scr').forEach(e=>e.style.display=e.id==id?'block':'none');
 $('top').style.display=id=='fight'?'none':'flex'}
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function renderMap(){
 show('map');
 const pts=NP.map(p=>p.join(',')).join(' ');
 let h='<svg class="rt" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="9 7" vector-effect="non-scaling-stroke" opacity=".85"/></svg>';
 h+='<div class="nd" style="left:'+NP[0][0]+'%;top:'+NP[0][1]+'%"><span class="cas">🏰</span><div class="pl"><b>'+t('begin')+'</b></div></div>';
 BS.forEach((b,i)=>{
  const cl=i<adv.c,cu=i==adv.c,p=NP[i+1],hid=i==5&&!cl&&!cu;
  h+='<div class="nd '+(cl?'cl':cu?'cu':'lk')+'" style="left:'+p[0]+'%;top:'+p[1]+'%"'+((cl||cu)?' onclick="openBoss('+i+')"':'')+'><img class="bp" data-b="'+i+'">'+(hid?'<span class="qm">?</span>':'')+'<div class="pl"><span class="pwn">'+PAWN+'</span><b>'+L(ST[i])+'</b><small>'+(hid?'? ? ?':L(b.mp))+'</small></div></div>'});
 h+='<div class="ttl">'+t('title')+'</div>';
 h+='<svg class="cmp" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#4a3a22" stroke-width="3"/><path d="M50 8L58 50 50 92 42 50Z M8 50L50 42 92 50 50 58Z" fill="#8a7550"/><text x="46" y="8" font-size="14" fill="#fff">N</text></svg>';
 $('mapw').innerHTML=h;
 BS.forEach((b,i)=>cln(b.i,u=>{const e=document.querySelector('[data-b="'+i+'"]');if(e)e.src=u}))}
let bi=0;
function openBoss(i){
 bi=i;const b=BS[i];show('boss');
 cln(b.i,u=>$('bimg').src=u);
 $('binfo').innerHTML='<div class="rk">'+b.rk+'</div><br><b style="font-size:1.3rem">'+L(b.n)+'</b><br>'+L(b.tt)+'<br>'+t('diff')+': '+L(b.df)+' · '+t('time')+': '+fmt(TM[i]*1000)+'<br>'+t('weak')+': '+L(b.wk)+'<br><span id="qt" style="color:#e8d9ff"></span>';
 say($('qt'),'«'+L(b.q)+'»')}
function showEnd(){show('intro');$('h').textContent='';say($('story'),t('end'));$('go').textContent=t('map');$('go').onclick=renderMap}
function ui(){
 document.documentElement.dir=st.lang=='ar'?'rtl':'ltr';
 $('bk').textContent=t('back');$('bl').textContent=st.lang=='en'?'العربية':'English';
 $('h').textContent=t('title');$('go').textContent=t('start');
 $('fb').textContent=t('fight');$('mb1').textContent=t('map');
 $('sur').textContent=t('sur');$('und').textContent=t('undo');$('endt').textContent=t('endT');$('rm').textContent=t('map');
 $('rr').textContent=t('retry')}

/* fight: you are White, the boss is Black */
let G,sel=null,last=[],over=true,pend=false,turn='p',bm=0,clk={p:0,b:0},act=null,tick=null,eng=null,eok=false,pnd=null,decoy=null,sty='agg';
function startEng(){
 if(eng)return;
 fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js').then(r=>r.text()).then(x=>{
  eng=new Worker(URL.createObjectURL(new Blob([x],{type:'text/javascript'})));
  eng.onmessage=e=>{const l=String(e.data);if(l=='uciok')eok=true;if(l.startsWith('bestmove')&&pnd){const p=pnd;pnd=null;p(l.split(' ')[1])}};
  eng.postMessage('uci')}).catch(()=>{})}
const mat=c=>{let s=0;G.board().flat().forEach(p=>{if(p&&p.color==c)s+=V[p.type]});return s};
function hpUp(){const v=Math.round(1000*mat('b')/39);$('hpf').style.width=v/10+'%';$('hpt').textContent='HP '+v+' / 1000'}
function fillFight(){
 const b=BS[bi];
 $('fst').textContent=L(ST[bi]);$('fnm').textContent=L(b.n)+' · '+L(b.tt);
 $('stbox').textContent=L(b.st);
 $('at1').textContent=t('abil');$('at2').textContent=L(b.ab[0]);$('at3').textContent=L(b.ab[1]);
 $('et1').textContent=t('enT');$('mt1').textContent=t('yourT')}
function startFight(){
 const b=BS[bi];startEng();
 G=new Chess();sel=null;last=[];over=false;pend=false;turn='p';bm=0;decoy=null;sty=b.s=='king'?'def':b.s;
 clk.p=clk.b=TM[bi]*1000;act='p';
 show('fight');fillFight();
 cln(b.i,u=>$('fimg').src=u);cln('IMG_1785.jpeg',u=>$('pimg').src=u);
 clearInterval(tick);tick=setInterval(tk,100);
 $('res').style.display='none';hpUp();render();upd();clocks()}
function clocks(){$('pclk').textContent='⌛ '+fmt(clk.p);$('bclk').textContent='⌛ '+fmt(clk.b)}
function tk(){if(over||!act)return;clk[act]-=100;clocks();if(clk[act]<=0)fin(act=='b'?'tw':'tl')}
function upd(){
 const my=turn=='p'&&!over;
 $('mt2').textContent=my?t(pend?'mv2':'mv1'):t('en2');
 $('et2').textContent=turn=='b'&&!over?t('en1'):t('en2');
 $('endt').disabled=!pend||over;$('und').disabled=!pend||over;
 $('me').classList.toggle('on',my);$('en').classList.toggle('on',turn=='b'&&!over)}
function render(){
 const hints=sel?G.moves({square:sel,verbose:true}).map(m=>m.to):[];
 let h='';
 for(let y=0;y<8;y++)for(let x=0;x<8;x++){
  const n='abcdefgh'[x]+(8-y),p=G.get(n);
  h+='<div class="sq'+(last.includes(n)?' l':'')+(sel==n?' s':'')+(hints.includes(n)?' d':'')+(decoy==n?' c':'')+'" data-s="'+n+'" style="left:'+x*12.5+'%;top:'+y*12.5+'%;background:'+((x+y)%2?'#2b2433':'#d9d3e6')+'">'+(p?'<span class="p'+p.color+'">'+GL[p.type]+'\uFE0E</span>':'')+'</div>'}
 $('bd').innerHTML=h}
$('bd').onclick=e=>{const s=e.target.closest('.sq');if(s)pickSq(s.dataset.s)};
function pickSq(sq){
 if(over||turn!='p'||pend)return;
 if(sel&&sel!=sq&&G.moves({square:sel,verbose:true}).some(m=>m.to==sq)){
  const m=G.move({from:sel,to:sq,promotion:'q'});sel=null;last=[m.from,m.to];pend=true;
  tone(m.captured?200:330,.08,.08);hpUp();render();upd();return}
 const p=G.get(sq);sel=p&&p.color=='w'?sq:null;render()}
function chk(){
 if(!G.game_over())return false;
 if(G.in_checkmate())fin(G.turn()=='b'?'w':'l');else fin('d');
 return true}
function fin(k){
 if(over)return;over=true;act=null;clearInterval(tick);
 const win=k=='w'||k=='tw';
 if(win){tone(784,.3,.1);if(bi==adv.c&&adv.c<6){adv.c++;saveA()}if(k=='w'){$('hpf').style.width='0%';$('hpt').textContent='HP 0 / 1000'}}else tone(150,.4,.1);
 $('rt1').textContent=(win?t('win'):k=='d'?t('draw'):t('lose'))+(k=='tw'?' '+t('tw'):k=='tl'?' '+t('tl'):'');
 $('rr').style.display=win?'none':'inline-block';
 $('res').style.display='flex';upd()}
function bossMove(){
 if(over)return;
 const b=BS[bi],ms=G.moves({verbose:true});
 if(b.s=='king'&&bm>0&&bm%10==0)sty=sty=='agg'?'def':'agg';
 const play=m=>{
  G.move(m);bm++;last=[m.from,m.to];
  decoy=null;if(b.s=='illu'&&Math.random()<.45)decoy='abcdefgh'[Math.floor(Math.random()*8)]+(1+Math.floor(Math.random()*8));
  turn='p';act='p';hpUp();render();upd();tone(m.captured?200:300,.08,.08);chk()};
 const caps=ms.filter(x=>x.captured||x.san.includes('+'));
 const bestCap=()=>caps.sort((a,z)=>(V[z.captured||'p']+(z.san.includes('+')?1:0))-(V[a.captured||'p']+(a.san.includes('+')?1:0)))[0];
 const rp=Math.min(.9,b.e<1500?(1500-b.e)/1500:0);
 if(Math.random()<rp)return play(R(ms));
 if(sty=='agg'&&caps.length&&Math.random()<.55)return play(bestCap());
 if(sty=='fly'&&Math.random()<.15)return play(R(ms));
 if(sty=='burn'&&Math.random()<.3)return play(caps.length?R(caps):R(ms));
 if(!eng||!eok)return play(R(ms));
 pnd=u=>play(ms.find(x=>x.from+x.to==(u||'').slice(0,4))||R(ms));
 setTimeout(()=>{if(pnd){const p=pnd;pnd=null;p('')}},6000);
 eng.postMessage('setoption name Skill Level value '+Math.max(0,Math.min(20,Math.round((b.e-1300)/85))));
 eng.postMessage('position fen '+G.fen());
 eng.postMessage('go movetime '+Math.round(Math.min(900,DL[bi]*.7)))}
$('endt').onclick=()=>{
 if(!pend||over)return;pend=false;
 if(chk())return;
 turn='b';act='b';upd();
 setTimeout(bossMove,DL[bi]*(.6+Math.random()*.8))};
$('und').onclick=()=>{if(!pend||over)return;G.undo();pend=false;last=[];hpUp();render();upd()};
$('sur').onclick=()=>{if(!over)fin('l')};

$('go').onclick=()=>{adv.seen=1;saveA();renderMap()};
$('fb').onclick=startFight;
$('mb1').onclick=renderMap;
$('xb').onclick=()=>{over=true;clearInterval(tick);renderMap()};
$('rr').onclick=startFight;
$('rm').onclick=()=>{$('res').style.display='none';clearInterval(tick);if(adv.c>=6&&bi==5&&over&&!adv.end){adv.end=1;saveA();showEnd()}else renderMap()};
$('gb').onclick=$('bl').onclick=()=>{
 st.lang=st.lang=='en'?'ar':'en';save();ui();
 if($('fight').style.display=='block'){fillFight();upd()}
 else if($('map').style.display=='block')renderMap();
 else if($('boss').style.display=='block')openBoss(bi)};
ui();
if(adv.seen)renderMap();else{show('intro');say($('story'),t('story'))}
</script>
</body>
</html>
