<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Courier New',monospace;color:#fff;text-align:center;background:#000 url(IMG_1692.jpeg) left/cover fixed}
body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.65)}
.w{position:relative;max-width:520px;margin:auto;padding:14px 10px}
.bar{display:flex;justify-content:space-between;align-items:center}
button,.cat{font-family:inherit;color:#fff;background:#000;border:3px solid #fff;cursor:pointer}
button{padding:8px 14px;font-size:1rem;margin:4px}
h1{text-shadow:3px 3px 0 #ff1493;letter-spacing:2px}
#list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{padding:10px;box-shadow:4px 4px 0 #ff1493}
.cat img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:8px}
#game{display:none}
.top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.top img{width:72px;height:72px;object-fit:contain;background:#fff;border:3px solid #000;border-radius:10px}
#talk{flex:1;background:#fff;color:#000;border:3px solid #000;border-radius:10px;padding:8px;min-height:50px;text-align:start}
#bd{direction:ltr;position:relative;width:min(96vw,480px);aspect-ratio:1;margin:8px auto;border:4px solid #fff;touch-action:none;user-select:none}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,235,59,.5)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(255,235,59,.7)}
.sq.dot::after{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(0,0,0,.35)}
.sq.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:5px solid rgba(0,0,0,.35)}
.pc{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;font-size:min(9vw,44px);line-height:1;transition:left .18s ease,top .18s ease,opacity .2s;cursor:grab;z-index:2}
.pc.drag{transition:none;z-index:9;cursor:grabbing}
.pw{color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.pb{color:#000;text-shadow:0 0 2px #fff,0 0 2px #fff}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;align-items:center;justify-content:center}
#modal>div{background:#111;border:4px solid #fff;padding:20px;width:min(90vw,340px)}
</style>
</head>
<body>
<div class="w">
  <div class="bar"><a id="bk" href="index.html" style="color:#fff"></a><button id="sb"></button></div>
  <h1 id="h"></h1>
  <div id="list"></div>
  <div id="game">
    <div class="top"><img id="face"><div id="talk"></div></div>
    <div id="bd"></div>
    <div id="status"></div>
    <button id="nb"></button><button id="cb"></button>
  </div>
</div>
<div id="modal"><div>
  <h3 id="mt"></h3>
  <p><button id="bl"></button></p>
  <p><button id="bm"></button></p>
  <p><button id="bs"></button></p>
  <button id="bx"></button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const R=a=>a[Math.floor(Math.random()*a.length)];

/* settings */
const S=JSON.parse(localStorage.getItem('cc')||'{}');
const st={lang:S.lang||'en',music:S.music!==false,sfx:S.sfx!==false};
const save=()=>localStorage.setItem('cc',JSON.stringify(st));
const T={
en:{pick:'PICK YOUR CAT',back:'Back',new:'New game',chg:'Change cat',your:'Your move',won:'You won!',lost:'You lost.',draw:'Draw.',set:'Settings',lang:'Language',mus:'Music',sfx:'Sounds',on:'ON',off:'OFF',close:'Close'},
ar:{pick:'اختر قطتك',back:'رجوع',new:'لعبة جديدة',chg:'غيّر القطة',your:'دورك',won:'فزت!',lost:'خسرت.',draw:'تعادل.',set:'الإعدادات',lang:'اللغة',mus:'الموسيقى',sfx:'الأصوات',on:'تشغيل',off:'إيقاف',close:'إغلاق'}};
const t=k=>T[st.lang][k];

/* cats */
const CATS=[
{n:'Cat 67',i:'IMG_1703.png',r:{en:'900',ar:'900'},mode:'rand',c:['#39ff14','#7a1fa2'],
 hi:{en:['Hello 67! How are you 67? I hope we play 67!'],ar:['مرحبا 67 كيف الحال 67 أتمنى نلعب 67']},
 tk:{en:['67 67 67 67 67','Focus! Say 67!','67676767','Nice move? No. 67!'],ar:['67 67 67 67 67','ركز! قول 67!','67676767','نقلة حلوة؟ لا. 67!']},
 op:{en:'This is the 67 Opening! 67!',ar:'هذي افتتاحية 67! 67!'},
 w:{en:['I win! 67 67 67!'],ar:['فزت! 67 67 67!']},
 l:{en:['I lost! 67676767676767'],ar:['لقد خسرت 67676767676767']}},
{n:'BOBBY',i:'IMG_1708.png',r:{en:'Unknown, changing',ar:'مجهول متغير'},
 h:[
  {c:['#e63946','#7a1520'],e:2100,tk:{en:['No time to think! MOVE!','Philosophy is for the weak. Attack!','Faster! Faster!'],ar:['لا وقت للتفكير! تحرك!','الفلسفة للضعفاء. هجوم!','أسرع! أسرع!']}},
  {c:['#2f6bff','#0c1f66'],e:1900,tk:{en:['Are we sure about this?','I do not trust that move. Or ours.','Maybe we are lost...'],ar:['هل نحن متأكدون؟','لا أثق بهذه النقلة. ولا بنقلتنا.','ربما ضعنا...']}},
  {c:['#ffd60a','#5c4a00'],e:2800,tk:{en:['Every move is a question the board must answer.','Interesting. I see where this is going.','Silence is also a move.'],ar:['كل نقلة سؤال، والرقعة ستجيب.','مثير. أرى إلى أين يسير هذا.','الصمت أيضاً نقلة.']}}],
 hi:{en:['We are three minds in one cat. Do not upset the red one.'],ar:['نحن ثلاثة عقول في قط واحد. لا تغضب الأحمر.']},
 w:{en:['Three minds, one victory.'],ar:['ثلاثة عقول، نصر واحد.']},
 l:{en:['We lost. The three of us will argue about it for a year.'],ar:['خسرنا. سنتجادل نحن الثلاثة حول هذا سنة كاملة.']}},
{n:'The Obsessed Cat',i:'IMG_1705.png',r:{en:'3000',ar:'3000'},e:3000,c:['#d4af37','#1a1a1a'],
 hi:{en:['Another victim. Please try not to embarrass yourself too quickly.'],ar:['ضحية أخرى. حاول ألا تحرج نفسك بسرعة.']},
 tk:{en:['Hm. Is that really what you wanted to play?','Interesting. Wrong, but interesting.','Do you even know why you moved there?','I have seen beginners play better.'],ar:['همم. هل هذا فعلاً ما أردت لعبه؟','مثير. خاطئ، لكنه مثير.','هل تعرف أصلاً لماذا حركتها هناك؟','رأيت مبتدئين يلعبون أفضل.']},
 w:{en:['As expected. Study more.'],ar:['كما توقعت. ادرس أكثر.']},
 l:{en:['Impossible... that was pure luck.'],ar:['مستحيل... كانت مجرد حظ.']}},
{n:'The Musical Cat',i:'IMG_1706.png',r:{en:'1700',ar:'1700'},e:1700,c:['#cfe3f2','#6b7a8f'],
 hi:{en:['Hm. Hello. Let us play.'],ar:['همم. مرحباً. لنلعب.']},
 tk:{en:['That note was a little flat.','Bold. Not good, but bold.','Hm.','I have heard worse.'],ar:['كانت النغمة نشازاً قليلاً.','جريئة. ليست جيدة، لكنها جريئة.','همم.','سمعت أسوأ.']},
 w:{en:['A calm victory.'],ar:['فوز هادئ.']},
 l:{en:['Well played. The silence is yours.'],ar:['لعبت جيداً. الصمت لك.']}},
{n:'The Ghost Cat',i:'IMG_1707.png',r:{en:'700',ar:'700'},e:700,weak:1,c:['#ffffff','#9db4e0'],
 hi:{en:['Boo! Oh, hello. Are you real?'],ar:['بووو! أوه، مرحباً. هل أنت حقيقي؟']},
 tk:{en:['Ooooh, what does that one do?','Spooky move!','Do you ever feel cold?','Why is that one a horse?'],ar:['أووه، ماذا تفعل هذه؟','نقلة مرعبة!','هل تشعر بالبرد أحياناً؟','لماذا هذه حصان؟']},
 w:{en:['I won? I thought I was only haunting.'],ar:['فزت؟ ظننت أني أطارد فقط.']},
 l:{en:['You defeated a ghost. Congrats?'],ar:['هزمت شبحاً. مبروك؟']}}
];

/* sounds + music */
let ac;
function snd(k){if(!st.sfx)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();
 const q={mv:[[330,.05]],cap:[[200,.08],[140,.1]],chk:[[880,.08],[1100,.12]],end:[[523,.12],[659,.12],[784,.12],[1047,.25]]}[k];
 let t0=ac.currentTime;
 q.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.08,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d);t0+=d})}
const mu=new Audio('glass_horizons.mp3');mu.loop=true;mu.volume=.5;
mu.addEventListener('loadedmetadata',()=>{mu.currentTime=+localStorage.getItem('cc_t')||0});
setInterval(()=>{if(!mu.paused)localStorage.setItem('cc_t',mu.currentTime)},1000);
document.addEventListener('pointerdown',()=>{if(st.music)mu.play().catch(()=>{})},{once:true});

/* engine */
let eng=null,engOK=false,pending=null;
function startEng(){if(eng)return;
 fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js').then(r=>r.text()).then(x=>{
  eng=new Worker(URL.createObjectURL(new Blob([x],{type:'text/javascript'})));
  eng.onmessage=e=>{const l=String(e.data);if(l=='uciok')engOK=true;
   if(l.startsWith('bestmove')&&pending){const p=pending;pending=null;p(l.split(' ')[1])}};
  eng.postMessage('uci');
 }).catch(()=>{})}

/* board */
let G,cat,over=false,sel=null,last=[],hd=0,busy=false,drag=null;
const GL={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
const FILES='abcdefgh';
const pos=(e,s)=>{e.style.left=(s.charCodeAt(0)-97)*12.5+'%';e.style.top=(8-+s[1])*12.5+'%';e.dataset.s=s};
const pcAt=s=>[...document.querySelectorAll('.pc')].find(e=>e.dataset.s==s&&!e.dataset.dead);
const say=x=>{$('talk').textContent=x};
function paint(){const c=cat.h?cat.h[hd].c:cat.c;$('bd').style.setProperty('--c1',c[0]);$('bd').style.setProperty('--c2',c[1])}
function build(){
 const b=$('bd');b.innerHTML='';
 for(let y=0;y<8;y++)for(let x=0;x<8;x++){
  const s=document.createElement('div');s.className='sq';s.id='q'+FILES[x]+(8-y);
  s.style.background=(x+y)%2?'var(--c2)':'var(--c1)';
  s.style.left=x*12.5+'%';s.style.top=y*12.5+'%';b.appendChild(s)}
 G.board().forEach((row,y)=>row.forEach((p,x)=>{if(!p)return;
  const e=document.createElement('div');e.className='pc p'+p.color;e.textContent=GL[p.type]+'\uFE0E';
  pos(e,FILES[x]+(8-y));b.appendChild(e)}))}
function marks(){
 document.querySelectorAll('.sq').forEach(e=>e.classList.remove('last','sel','dot','cap'));
 last.forEach(s=>$('q'+s).classList.add('last'));
 if(sel){$('q'+sel).classList.add('sel');
  G.moves({square:sel,verbose:true}).forEach(m=>$('q'+m.to).classList.add((G.get(m.to)||m.flags.includes('e'))?'cap':'dot'))}}
function sqFrom(ev){
 const r=$('bd').getBoundingClientRect();
 const x=Math.floor((ev.clientX-r.left)/r.width*8),y=Math.floor((ev.clientY-r.top)/r.height*8);
 return(x<0||x>7||y<0||y>7)?null:FILES[x]+(8-y)}
const legal=(f,to)=>G.moves({square:f,verbose:true}).some(m=>m.to==to);
function follow(ev){
 const r=$('bd').getBoundingClientRect();
 drag.e.style.left=((ev.clientX-r.left)/r.width*100-6.25)+'%';
 drag.e.style.top=((ev.clientY-r.top)/r.height*100-6.25)+'%'}

$('bd').addEventListener('pointerdown',ev=>{
 if(over||busy||G.turn()!='w')return;
 const s=sqFrom(ev);if(!s)return;ev.preventDefault();
 if(sel&&sel!=s&&legal(sel,s)){doMove(sel,s);return}
 const p=G.get(s);
 if(p&&p.color=='w'){sel=s;marks();const e=pcAt(s);drag={e,from:s};e.classList.add('drag');follow(ev);$('bd').setPointerCapture(ev.pointerId)}
 else{sel=null;marks()}});
$('bd').addEventListener('pointermove',ev=>{if(drag)follow(ev)});
$('bd').addEventListener('pointerup',ev=>{
 if(!drag)return;
 const d=drag;drag=null;d.e.classList.remove('drag');
 const to=sqFrom(ev);
 if(to&&to!=d.from&&legal(d.from,to))doMove(d.from,to);else pos(d.e,d.from)});

function doMove(f,to){
 const m=G.move({from:f,to:to,promotion:'q'});
 if(!m)return;sel=null;apply(m)}
function apply(m){
 const e=pcAt(m.from);
 if(m.captured){
  const ce=pcAt(m.flags.includes('e')?m.to[0]+m.from[1]:m.to);
  if(ce){ce.dataset.dead=1;ce.style.opacity=0;setTimeout(()=>ce.remove(),250)}}
 if(m.flags.includes('k')||m.flags.includes('q')){
  const k=m.flags.includes('k'),r=m.color=='w'?'1':'8',re=pcAt((k?'h':'a')+r);
  if(re)pos(re,(k?'f':'d')+r)}
 e.classList.remove('drag');pos(e,m.to);
 if(m.promotion)e.textContent=GL[m.promotion]+'\uFE0E';
 last=[m.from,m.to];marks();
 snd(G.game_over()?'end':G.in_check()?'chk':m.captured?'cap':'mv');
 if(!endCheck()&&m.color=='w'){taunt();busy=true;setTimeout(catMove,650)}}
function taunt(){
 if(G.history().length==1&&cat.op)say(cat.op[st.lang]);
 else if(cat.tk&&Math.random()<.55)say(R(cat.tk[st.lang]))}
function endCheck(){
 if(!G.game_over())return false;
 over=true;let k='draw';
 if(G.in_checkmate()){const pw=G.turn()=='b';say(R((pw?cat.l:cat.w)[st.lang]));k=pw?'won':'lost'}else say('...');
 $('status').textContent=t(k);return true}
function catMove(){
 if(over)return;
 if(cat.h){hd=Math.floor(Math.random()*3);paint();say(R(cat.h[hd].tk[st.lang]))}
 const ms=G.moves({verbose:true});
 const rnd=()=>{const c=ms.filter(m=>m.captured);return R(c.length&&Math.random()<.5?c:ms)};
 const fin=m=>{busy=false;if(over||!m)return;G.move(m);$('status').textContent=t('your');apply(m)};
 if(cat.mode=='rand'||(cat.weak&&Math.random()<.6)||!eng||!engOK){setTimeout(()=>fin(rnd()),450);return}
 const elo=cat.h?cat.h[hd].e:cat.e;
 pending=u=>fin(ms.find(x=>x.from+x.to==(u||'').slice(0,4))||rnd());
 setTimeout(()=>{if(pending){const p=pending;pending=null;p('')}},5000);
 eng.postMessage('setoption name Skill Level value '+Math.round(Math.max(0,Math.min(20,(elo-1300)/85))));
 eng.postMessage('position fen '+G.fen());
 eng.postMessage('go movetime '+Math.round(300+elo/6))}

/* screens */
function go(i){
 cat=CATS[i];startEng();
 $('list').style.display='none';$('h').style.display='none';$('game').style.display='block';
 $('face').src=cat.i;newGame()}
function newGame(){
 G=new Chess();over=false;sel=null;last=[];busy=false;hd=0;
 build();paint();say(R(cat.hi[st.lang]));$('status').textContent=t('your')}
function ui(){
 document.documentElement.dir=st.lang=='ar'?'rtl':'ltr';
 $('h').textContent=t('pick');$('bk').textContent='← '+t('back');$('sb').textContent='⚙ '+t('set');
 $('nb').textContent=t('new');$('cb').textContent=t('chg');$('mt').textContent=t('set');$('bx').textContent=t('close');
 $('bl').textContent=t('lang')+': '+(st.lang=='en'?'English':'العربية');
 $('bm').textContent=t('mus')+': '+t(st.music?'on':'off');
 $('bs').textContent=t('sfx')+': '+t(st.sfx?'on':'off');
 $('list').innerHTML=CATS.map((c,i)=>'<div class="cat" onclick="go('+i+')"><img src="'+c.i+'"><b>'+c.n+'</b><br><small>'+c.r[st.lang]+'</small></div>').join('')}
$('sb').onclick=()=>$('modal').style.display='flex';
$('bx').onclick=()=>$('modal').style.display='none';
$('bl').onclick=()=>{st.lang=st.lang=='en'?'ar':'en';save();ui()};
$('bm').onclick=()=>{st.music=!st.music;save();st.music?mu.play().catch(()=>{}):mu.pause();ui()};
$('bs').onclick=()=>{st.sfx=!st.sfx;save();ui()};
$('nb').onclick=newGame;
$('cb').onclick=()=>{$('game').style.display='none';$('list').style.display='grid';$('h').style.display='block'};
ui();
</script>
</body>
</html>
